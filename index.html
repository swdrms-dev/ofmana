<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" data-keep>
<meta name="viewport" content="width=device-width, initial-scale=1" data-keep>
<title data-keep>Gestion des modèles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-keep>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" data-keep>
<style data-keep>
/* VOICE: back-office d'agence net et rapide, on y passe la journée
   IDEA: une régie — chaque créatrice a sa ligne et sa couleur, partout dans l'outil
   PICTURE: revenus empilés par modèle sur 6 mois, couleurs = modèles
   COLOUR: nuit #1b1520 (barre latérale), fond blanc chaud, accent corail-rose #ff4f6d
   TYPE: Plus Jakarta Sans titres et chiffres, Inter texte. LAYOUT: barre latérale + contenu, KPI, graphique, listes */
:root{color-scheme:light dark;--bg:light-dark(#f6f3f1,#111013);--panel:light-dark(#fff,#1a181d);--ink:light-dark(#1b1520,#f2edf1);--mute:light-dark(#6e6470,#a59ba7);--line:light-dark(#ebe3e5,#2b2730);--side:light-dark(#1b1520,#0b0a0d);--acc:#ff4f6d;--accInk:light-dark(#d42a4a,#ff7a90);--soft:light-dark(#ffeef1,#35171f);--ok:light-dark(#137a54,#4cd39a);--okbg:light-dark(#e3f6ee,#11291f);--warn:light-dark(#a8550a,#ffb55e);--warnbg:light-dark(#fff1e0,#2e200f);--blue:light-dark(#2d5bd8,#8fb0ff);--bluebg:light-dark(#e8efff,#16213a);--r:14px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Plus Jakarta Sans",Inter,sans-serif}
h1{font-size:clamp(26px,3.2vw,36px);line-height:1.1;margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 14px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#efe7ee;padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font:800 17px "Plus Jakarta Sans",sans-serif}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#cfc4cd;text-decoration:none;font-weight:500;min-height:44px}
nav a:hover{background:#ffffff12;color:#fff}
nav a.on{background:#ffffff1c;color:#fff}nav a.on svg{color:var(--acc)}
.badge{margin-left:auto;background:var(--acc);color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.ghost-side{background:none;border:1px solid #ffffff26;color:#e9dfe7;border-radius:10px;padding:0 12px;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:44px}
.ghost-side:hover{background:#ffffff12}
.save{font-size:13px;color:#b5aab3;padding:0 8px;display:flex;align-items:center;gap:8px}
.save i{width:8px;height:8px;border-radius:50%;background:#7c7280;flex:none}
.save.ok i,.save.local i{background:#4cd39a}.save.saving i{background:#ffb55e}.save.err i,.save.ro i{background:var(--acc)}
main{padding:clamp(18px,3.5vw,44px);max-width:1280px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin-bottom:24px}
.head p{margin:6px 0 0;color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--accInk)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--mute);flex:none}
.icon-btn:hover{background:var(--soft);color:var(--accInk)}
.field,.sel,.search input{min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:0 14px;font-size:16px;color:var(--ink)}
.search{position:relative;display:block}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}.search input{padding-left:38px;width:min(260px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500}
.chip span{color:var(--mute);margin-left:4px}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip.on span{color:inherit;opacity:.7}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.sample{font-size:13px;color:var(--mute);margin:-14px 0 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px;margin-bottom:16px}
.kpi small{color:var(--mute);font-size:13px;display:block}
.kpi b{display:block;font:800 clamp(24px,2.6vw,30px)/1.15 "Plus Jakarta Sans",sans-serif;margin:6px 0 4px;white-space:nowrap}
.delta{font-size:13px;font-weight:600;white-space:nowrap}.up{color:var(--ok)}.down{color:var(--accInk)}.mutd{color:var(--mute);font-weight:500}
.kpi.hot{background:var(--acc);border-color:var(--acc);color:#fff}.kpi.hot small,.kpi.hot .delta{color:#fff;opacity:.9}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.chart{display:flex;align-items:flex-end;gap:clamp(8px,2vw,22px);height:260px;border-bottom:1px solid var(--line)}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col .tot{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:6px;white-space:nowrap}.col.cur .tot{color:var(--ink)}
.stackbar{width:min(56px,100%);display:flex;flex-direction:column-reverse;border-radius:8px 8px 0 0;overflow:hidden;transform-origin:bottom;animation:grow .5s ease-out}
.stackbar span{display:block;border-top:1px solid var(--panel)}
.months{display:flex;gap:clamp(8px,2vw,22px);margin-top:8px}.months span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px;color:var(--mute)}.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;display:inline-block}
.rank{display:flex;flex-direction:column;gap:14px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.rrow .bar{grid-column:2/4;height:6px;background:var(--line);border-radius:9px;overflow:hidden}.rrow .bar i{display:block;height:100%;background:var(--c);border-radius:9px}
.av{width:42px;height:42px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font:700 14px "Plus Jakarta Sans",sans-serif;flex:none}
.av.sm{width:32px;height:32px;border-radius:9px;font-size:12px;grid-row:span 2}
.num{white-space:nowrap;font-weight:600;text-align:right}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .t{flex:1}.li small{color:var(--mute);display:block;font-size:13px}
.more{display:inline-block;margin-top:12px;color:var(--accInk);font-weight:600;text-decoration:none;font-size:14px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--mute);white-space:nowrap}
.p-active,.p-publie{background:var(--okbg);color:var(--ok)}.p-onboarding,.p-programme{background:var(--bluebg);color:var(--blue)}
.p-pret,.p-moyenne{background:var(--warnbg);color:var(--warn)}.p-haute{background:var(--soft);color:var(--accInk)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.mcard{position:relative;display:flex;flex-direction:column;gap:16px;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 12px 30px -14px #1b152055}
.cover{position:absolute;inset:0;border:0;background:none;border-radius:var(--r);cursor:pointer}
.mtop{display:flex;align-items:center;gap:12px}.who{flex:1}.who b{display:block;font-size:16px}.who small{color:var(--mute)}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mstats small{display:block;color:var(--mute);font-size:12px}.mstats b{display:block;font:700 18px "Plus Jakarta Sans",sans-serif;white-space:nowrap}
.spark{display:flex;align-items:flex-end;gap:4px;height:44px}.spark i{flex:1;background:var(--c);opacity:.3;border-radius:4px 4px 0 0}.spark i:last-child{opacity:1}
.mfoot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.warnbox{border-color:var(--acc);margin-bottom:16px}
.day{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:18px 0;border-top:1px solid var(--line)}.day:first-child{border-top:0;padding-top:0}.day:last-child{padding-bottom:0}
.dlabel b{display:block;font:800 32px/1 "Plus Jakarta Sans",sans-serif}.dlabel small{color:var(--mute)}
.day.today .dlabel b{color:var(--accInk)}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:4px auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 0;overflow:hidden}
.item .stripe{align-self:stretch;background:var(--c);margin:-8px 0}
.item time{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .t b{display:block;font-weight:600}.item .t small{color:var(--mute)}
.act{display:flex;align-items:center;gap:2px}
.stsel{min-height:36px;border:0;border-radius:9px;padding:0 8px;font-size:14px;font-weight:600;cursor:pointer;margin-right:4px}
.none{margin:0;color:var(--mute);font-size:14px}
.addday{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:9px;color:var(--mute);min-height:36px;padding:0 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.addday:hover{color:var(--accInk);border-color:var(--acc)}
.empty{color:var(--mute);text-align:center;padding:36px 16px;margin:0}
.quick{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:10px;margin-bottom:18px;padding:14px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}
.chk{width:22px;height:22px;accent-color:var(--acc);cursor:pointer;margin:0 0 0 2px}
.tt{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500;display:block}.tt:hover{color:var(--accInk)}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.tm{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center}.tm span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.late{color:var(--accInk);font-weight:600}
.ov{position:fixed;inset:0;background:#0d0a0f80;z-index:20;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;animation:slide .2s ease-out;box-shadow:-20px 0 60px -20px #0007;margin:0}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 16px 22px;border-bottom:1px solid var(--line)}.dh h2{margin:0;font-size:20px}
.db{padding:22px;overflow:auto;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
.db label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
.db .full,.db h3,.revs,.hint{grid-column:1/-1}
.db .field{width:100%;font-weight:400}
textarea.field{min-height:96px;padding:12px 14px;resize:vertical;line-height:1.45}
.db h3{margin:8px 0 0;font-size:15px}
.revs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hint{margin:0;color:var(--mute);font-size:14px}
.checkline{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:15px!important}
.df{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}.df .sp{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--ink);color:var(--bg);padding:8px 8px 8px 18px;border-radius:12px;display:flex;gap:10px;align-items:center;z-index:30;transition:transform .25s;max-width:calc(100% - 32px);min-height:48px}
.toast.show{transform:translate(-50%,0)}
.toast button{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;min-height:36px;padding:0 10px}
.padd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:16px;padding:14px}
.kpis.sm .kpi b{font-size:24px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 14px;align-items:start;scroll-snap-type:x proximity}
.kcol{background:light-dark(#eee8e6,#18161b);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:360px;scroll-snap-align:start;transition:background .15s,box-shadow .15s}
.kcol.over{background:var(--soft);box-shadow:inset 0 0 0 2px var(--acc)}
.kcol.lost .pcard{opacity:.7}
.kh{display:flex;align-items:center;gap:8px;padding:4px 4px 6px;font:700 14px "Plus Jakarta Sans",sans-serif}
.kh i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}.kh .n{margin-left:auto;color:var(--mute);font-weight:600;font-size:13px}
.kempty{border:1.5px dashed light-dark(#d9d0d2,#332e37);border-radius:12px;color:var(--mute);font-size:13px;text-align:center;padding:20px 8px}
.pcard{position:relative;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 6px 10px 12px;cursor:grab;user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 6px;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 8px 20px -12px #1b152066}
.pcard b{display:block;font-weight:600;overflow-wrap:anywhere}.pcard small{color:var(--mute);font-size:13px;display:block}
.pmeta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute)}.pmeta:empty{display:none}
.grip{touch-action:none;cursor:grab;width:34px;height:34px;border:0;background:none;color:var(--mute);border-radius:8px;display:grid;place-items:center;margin:-6px 0 0}
.grip:hover{background:var(--line)}
.pcard.dragging{opacity:.3}
.ghost{position:fixed;left:0;top:0;margin:0;pointer-events:none;z-index:40;box-shadow:0 18px 40px -12px #0008}
body.dragon,body.dragon *{cursor:grabbing!important}
.p-relancer{background:var(--warnbg);color:var(--warn)}
.instalink{grid-column:1/-1;color:var(--accInk);font-weight:600;text-decoration:none}
.scroll{overflow-x:auto}
/* fiches */
.dh.hero{align-items:flex-start;gap:14px;padding:20px 14px 0 22px;border:0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.av.lg{width:56px;height:56px;border-radius:16px;font-size:20px;transition:background .2s}
.hn{flex:1;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.title-in{font:800 22px/1.2 "Plus Jakarta Sans",sans-serif;border:0;background:none;padding:4px 6px;margin-left:-6px;border-radius:8px;width:100%;color:var(--ink)}
.title-in::placeholder{color:var(--mute);opacity:.7}
.title-in:hover,.title-in:focus,.handle-in input:hover,.handle-in input:focus{background:var(--bg)}
.title-wrap{display:flex;align-items:center;font:800 22px "Plus Jakarta Sans",sans-serif;color:var(--mute)}.title-wrap .title-in{margin-left:0}
.handle-in{display:flex;align-items:center;color:var(--mute);font-size:15px}.handle-in input{border:0;background:none;padding:4px 4px;color:var(--mute);width:100%;font-size:15px;border-radius:6px}.handle-in input:focus{color:var(--ink)}
.tabs{display:flex;gap:2px;width:100%;margin:10px 0 0 -8px;overflow-x:auto}
.tab{background:none;border:0;padding:0 12px;min-height:44px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}.tab:hover{color:var(--ink)}.tab.on{color:var(--ink);border-color:var(--acc)}
.dh.hero:not(:has(.tabs)){padding-bottom:18px}
.panel{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;align-content:start}.panel[hidden]{display:none}
.fgroup{display:flex;flex-direction:column;gap:8px}.fgroup.full{grid-column:1/-1}.flabel{font-size:13px;font-weight:600;color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.db .opt{display:inline-flex;flex-direction:row;position:relative;font-size:14px;color:var(--ink);gap:0}
.opt input,.sw input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;background:var(--panel);transition:background .12s,border-color .12s}
.opt span:hover{border-color:var(--mute)}
.opt input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt input:focus-visible+span,.sw input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:4px}.db .sw{display:block;position:relative}
.sw span{display:block;width:30px;height:30px;border-radius:50%;background:var(--c);cursor:pointer;transition:transform .12s}.sw span:hover{transform:scale(1.1)}.sw input:checked+span{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--c)}
.slider{display:flex;align-items:center;gap:14px}.slider input{flex:1;accent-color:var(--acc);height:28px;cursor:pointer}.slider output{font:800 24px "Plus Jakarta Sans",sans-serif;min-width:70px;text-align:right;color:var(--ink)}
.affix{position:relative;display:block}.affix .field{padding-right:36px;width:100%}.affix>span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none;font-size:15px;font-weight:400}
.revlist{display:flex;flex-direction:column;gap:8px;grid-column:1/-1}
.revrow{display:grid;grid-template-columns:100px 150px minmax(0,1fr);gap:12px;align-items:center}.rm{font-weight:600}
.rbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.rbar i{display:block;height:100%;width:0;border-radius:99px;transition:width .25s}
.revtot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:1px solid var(--line);color:var(--mute)}.revtot b{color:var(--ink);font:800 20px "Plus Jakarta Sans",sans-serif}
.linkdanger{background:none;border:0;color:var(--mute);cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px;font-weight:500}.linkdanger:hover{color:var(--accInk)}
.db .agecard{grid-column:1/-1;display:flex;flex-direction:row;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.db .agecard:has(input:checked){border-color:var(--ok);background:var(--okbg)}.agecard small{display:block;color:var(--mute);font-weight:400;font-size:13px;margin-top:2px}
.instalink{color:var(--accInk);font-weight:600;text-decoration:none;font-size:14px;padding:2px 0}
/* stats */
.chart.big{height:300px}
.mchip{display:inline-flex;align-items:center;gap:8px}.mchip.off{opacity:.5}.mchip.off .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.srow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.srow small{display:block;color:var(--mute);font-size:13px}.srow b{font:700 20px "Plus Jakarta Sans",sans-serif;white-space:nowrap}
.stackbar span{transition:filter .15s;cursor:pointer}.stackbar span:hover{filter:brightness(1.15) saturate(1.1)}
.fig{position:relative;min-height:280px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gl{stroke:var(--line)}.yl{fill:var(--mute);font-size:11px;text-anchor:end}.xl{fill:var(--mute);font-size:11px;text-anchor:middle}
.area{fill:var(--acc);fill-opacity:.12}.ln1{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round}.ln2{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4}
.pt1{fill:var(--panel);stroke:var(--acc);stroke-width:2.5;pointer-events:none}.pt2{fill:var(--ink);pointer-events:none}
.hit{fill:transparent;cursor:crosshair}.hit:hover{fill:var(--ink);fill-opacity:.06}
.dwrap{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:20px;align-items:center}
.donut{width:100%;max-width:200px;display:block;overflow:visible}.dtrack{fill:none;stroke:var(--line);stroke-width:26}.dseg{fill:none;stroke-width:26;cursor:pointer;transition:stroke-width .15s}.dseg:hover{stroke-width:32}
.dn1{font:800 24px "Plus Jakarta Sans",sans-serif;fill:var(--ink);text-anchor:middle}.dn2{font-size:12px;fill:var(--mute);text-anchor:middle}
.dleg{display:flex;flex-direction:column;gap:10px}.dleg div{display:flex;align-items:center;gap:8px}.dleg span{flex:1}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr) 36px 60px;gap:10px;align-items:center;font-size:14px;cursor:default}
.fbar{display:flex;justify-content:center;height:28px;background:light-dark(#f3eff0,#211e25);border-radius:8px}.fbar i{display:block;height:100%;border-radius:8px;transition:filter .15s}.frow:hover .fbar i{filter:brightness(1.12)}
.fconv{font-size:12px;color:var(--mute);white-space:nowrap}
.segbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}.segbar span:hover{filter:brightness(1.1)}
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.hrow{display:grid;grid-template-columns:130px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:14px}.hrow div{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.hrow i{display:block;height:100%;background:var(--acc);border-radius:99px}
.sub{font-size:15px;margin:20px 0 8px}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.perf{width:100%;border-collapse:collapse;font-size:14px}.perf th,.perf td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.perf th:first-child,.perf td:first-child{text-align:left}.perf tr:last-child td{border-bottom:0}.perf tbody tr:hover{background:light-dark(#faf7f6,#1f1c22)}
.th{background:none;border:0;font-weight:600;color:var(--mute);cursor:pointer;padding:4px 0;font-size:13px;min-height:32px}.th.on,.th:hover{color:var(--ink)}
.tname{display:inline-flex;align-items:center;gap:10px;font-weight:600}.tname .av.sm{grid-row:auto}
.spark.mini{height:28px;width:90px;display:inline-flex}
.tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:9px;font-size:13px;line-height:1.4;white-space:pre-line;opacity:0;transition:opacity .12s;max-width:240px;font-weight:500;box-shadow:0 8px 24px -8px #0006}.tip.on{opacity:1}
@media(max-width:600px){.panel{grid-template-columns:minmax(0,1fr)}.revrow{grid-template-columns:90px minmax(0,1fr)}.revrow .rbar{grid-column:1/-1}.dwrap{grid-template-columns:minmax(0,1fr);justify-items:center}.dleg{width:100%}.frow{grid-template-columns:92px minmax(0,1fr) 28px 50px;font-size:13px}.hrow{grid-template-columns:100px minmax(0,1fr) 24px}.dh.hero{padding-left:16px}}
@media(max-width:420px){.brand{display:none}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}@keyframes fade{from{opacity:0}}@keyframes grow{from{transform:scaleY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1000px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}.quick{grid-template-columns:repeat(3,minmax(0,1fr))}.quick input[name=title]{grid-column:1/-1}.quick .btn{grid-column:1/-1;justify-content:center}}
@media(max-width:800px){.app{grid-template-columns:minmax(0,1fr)}.side{height:auto;z-index:10;flex-direction:row;align-items:center;padding:8px 10px;gap:8px}.brand{padding:0}.brand b{display:none}nav{flex-direction:row;gap:2px}nav a{padding:10px}nav a span{display:none}nav a .badge{margin-left:0}.side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}.save span,.ghost-side span{display:none}.ghost-side{padding:0 11px}}
@media(max-width:600px){.day{grid-template-columns:minmax(0,1fr);gap:10px}.dlabel{display:flex;gap:10px;align-items:baseline}.dlabel b{font-size:24px}.item{grid-template-columns:4px auto minmax(0,1fr)}.item .act{grid-column:2/-1}.db{grid-template-columns:minmax(0,1fr);padding:18px}.revs{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:minmax(0,1fr)}.task{grid-template-columns:auto minmax(0,1fr) auto}.task .pill{display:none}.search input{width:100%}.tools,.search{width:100%}.tools .btn{flex:1;justify-content:center}}
</style>

<body>
<div id="root"></div>
<script id="state" type="application/json">{"agency":"Mon Agence","sample":false,"savedAt":1,"models":[],"content":[],"tasks":[],"prospects":[]}</script>
<script id="app">{
const D=document,$=s=>D.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HEAD=[...D.head.querySelectorAll('[data-keep]')].map(e=>e.outerHTML).join('\n');
const APP=$('#app').textContent;
const LS='agence-modeles-v2';
let S=JSON.parse($('#state').textContent);
let dirty=false;
try{const L=JSON.parse(localStorage.getItem(LS)||'null');if(L&&Array.isArray(L.models)&&(L.savedAt||0)>(S.savedAt||0)){S=L;dirty=true}}catch(e){}
S.prospects=S.prospects||[];
const VIEWS={dashboard:'Tableau de bord',modeles:'Modèles',prospection:'Prospection',stats:'Statistiques',planning:'Planning',taches:'Tâches'};
let ui={view:'dashboard',mf:'all',pf:'all',tf:'todo',q:'',pq:'',sp:6,ss:'r'};
try{Object.assign(ui,JSON.parse(sessionStorage.getItem(LS+'-ui')||'{}'))}catch(e){}
const hv=location.hash.slice(1);if(VIEWS[hv])ui.view=hv;else if(!VIEWS[ui.view])ui.view='dashboard';
const keepUI=()=>{try{sessionStorage.setItem(LS+'-ui',JSON.stringify(ui))}catch(e){}};

const COLORS=['#ff4f6d','#3d7bfd','#f5a524','#14a37f','#8b5cf6','#06a3c4','#ef6c2f','#d6409f'];
const ST={active:'Active',onboarding:'Onboarding',pause:'En pause'};
const CST={idee:'Idée',pret:'Prêt',programme:'Programmé',publie:'Publié'};
const TYPES=['Post mur','PPV message','Story','Live','Reel promo','Promo / campagne'];
const PRIO={haute:'Haute',moyenne:'Moyenne',basse:'Basse'},PR={haute:0,moyenne:1,basse:2};
const GHOST={name:'Agence',color:'#8a8090'};
const PS={a_contacter:'À contacter',dm:'DM envoyé',relance:'Relancée',positive:'Réponse positive',appel:'Appel / visio',contrat:'Contrat envoyé',signee:'Signée',negative:'Pas intéressée'};
const PSC={a_contacter:'#8a8090',dm:'#3d7bfd',relance:'#f5a524',positive:'#14a37f',appel:'#06a3c4',contrat:'#8b5cf6',signee:'#ff4f6d',negative:'#b0a7b1'};
const POS=['positive','appel','contrat','signee'];
const MS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const ML=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const f0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}),f2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}),fn=new Intl.NumberFormat('fr-FR');
const eur=n=>f0.format(n||0),eur2=n=>f2.format(n||0),num=n=>fn.format(n||0);
const kEur=n=>n>=1000?(n/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' k€':eur(n);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=new Date();TODAY.setHours(0,0,0,0);const T0=iso(TODAY);
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const months=(n=6)=>{const r=[];for(let i=n-1;i>=0;i--){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);r.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}return r};
const mS=k=>MS[+k.slice(5)-1],mL=k=>ML[+k.slice(5)-1],cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const rev=(m,k)=>+((m.rev||{})[k]||0);
const uid=()=>Math.random().toString(36).slice(2,10);
const byId=(a,id)=>a.find(x=>x.id===id),mdl=id=>byId(S.models,id);
const ini=n=>(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const opts=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${esc(k)}"${k===v?' selected':''}>${esc(l)}</option>`).join('');
const modelOpts=v=>S.models.map(m=>`<option value="${m.id}"${m.id===v?' selected':''}>${esc(m.name)}</option>`).join('');
const isLate=t=>!t.done&&!!t.due&&t.due<T0;
const pct=(a,b)=>b?Math.round((a-b)/b*100):null;
const dl=(v,lbl)=>v==null?'':`<span class="delta ${v>=0?'up':'down'}">${v>=0?'+':''}${v} %${lbl?' vs '+lbl:''}</span>`;
const dShort=s=>pISO(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const cmpC=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
const cmpT=(a,b)=>(a.done-b.done)||(isLate(b)-isLate(a))||(PR[a.prio]-PR[b.prio])||String(a.due||'9').localeCompare(String(b.due||'9'));
const nextColor=()=>COLORS.find(c=>!S.models.some(m=>m.color===c))||COLORS[S.models.length%COLORS.length];
const sv=(p,s=20,f)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f||'none'}" stroke="${f?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
modeles:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/>',
prospection:'<path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/>',
stats:'<path d="M3 21h18M6 17v-5M11 17V7M16 17v-8M21 17V4"/>',
grip:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
planning:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
taches:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/>',
plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
logo:'<path d="M12 2.5l2.6 6.4 6.9.5-5.3 4.4 1.7 6.7L12 16.8l-5.9 3.7 1.7-6.7-5.3-4.4 6.9-.5z"/>'};

/* ---------- sauvegarde ---------- */
let art=null,status='wait',saveT=null,prev=null;
const SL={wait:'Connexion…',ok:'Enregistré',saving:'Enregistrement…',local:'Enregistré sur cet appareil',ro:'Lecture seule',err:'Échec de l’enregistrement'};
const setStatus=s=>{status=s;const el=$('#save');if(el){el.className='save '+s;el.innerHTML='<i></i><span>'+SL[s]+'</span>'}};
const docHTML=()=>'<!DOCTYPE html>\n<html lang="fr">\n<head>\n'+HEAD+'\n</head>\n<body>\n<div id="root"></div>\n<script id="state" type="application/json">'+JSON.stringify(S).replace(/</g,'\\u003c')+'</'+'script>\n<script id="app">'+APP+'</'+'script>\n</body>\n</html>';
const save=async()=>{if(!art){if(status!=='wait')setStatus('local');return}
 try{await art.publish(docHTML());dirty=false;setStatus('ok')}catch(e){const c=String(e&&(e.code||e.message)||e);if(/conflict/i.test(c))return;setStatus(/not_granted|not_writer/i.test(c)?'ro':'err')}};
const schedule=()=>{dirty=true;clearTimeout(saveT);setStatus(art?'saving':(status==='wait'?'wait':'local'));saveT=setTimeout(save,1200)};
const persist=()=>{S.savedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const commit=(fn,msg)=>{prev=JSON.stringify(S);fn();persist();render();if(typeof msg==='function')msg=msg();if(msg)toast(msg,true);schedule()};
const undo=()=>{if(!prev)return;S=JSON.parse(prev);prev=null;persist();render();toast('Action annulée');schedule()};
let tT;const toast=(m,u)=>{const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>${u?'<button data-act="undo">Annuler</button>':''}`;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),5000)};

/* ---------- vues ---------- */
const taskRow=t=>{const m=mdl(t.modelId);return `<div class="task${t.done?' done':''}"><input type="checkbox" class="chk" data-act="toggle" data-id="${t.id}"${t.done?' checked':''} aria-label="Terminer : ${esc(t.title)}"><div><button class="tt" data-act="edittask" data-id="${t.id}">${esc(t.title)}</button><div class="tm">${m?`<span><i class="dot" style="--c:${m.color}"></i>${esc(m.name)}</span>`:'<span>Agence</span>'}${t.due?`<span class="${isLate(t)?'late':''}">${isLate(t)?'En retard · ':''}${dShort(t.due)}</span>`:''}${t.who?`<span>${esc(t.who)}</span>`:''}</div></div><span class="pill p-${t.prio}">${PRIO[t.prio]||''}</span><button class="icon-btn" data-act="deltask" data-id="${t.id}" aria-label="Supprimer la tâche">${sv(I.trash,18)}</button></div>`};

const vDash=()=>{
 const ms=months(),cur=ms[5],pv=ms[4],M=S.models;
 const PA=S.prospects.filter(p=>p.stage!=='signee'&&p.stage!=='negative').length,PP=S.prospects.filter(p=>POS.includes(p.stage)&&p.stage!=='signee').length;
 if(!M.length)return `<div class="head"><div><h1>Bienvenue dans ${esc(S.agency)}</h1><p>Ajoute ta première modèle pour voir ici les revenus, le planning et les tâches.${S.prospects.length?` Tu as ${PA} profil${PA>1?'s':''} en cours de prospection.`:' Ou commence par la prospection : colle les @ Instagram des profils que tu veux approcher.'}</p></div><div class="tools"><a class="btn" href="#prospection">${sv(I.prospection,18)}Prospection</a><button class="btn pri" data-act="add-model">${sv(I.plus,18)}Ajouter une modèle</button></div></div>`;
 const tot=k=>M.reduce((a,m)=>a+rev(m,k),0),com=k=>M.reduce((a,m)=>a+rev(m,k)*(+m.pct||0)/100,0);
 const T=tot(cur),P=tot(pv),C=com(cur),CP=com(pv),d=pct(T,P);
 const subs=M.filter(m=>m.status!=='pause').reduce((a,m)=>a+(+m.subs||0),0);
 const lateN=S.tasks.filter(isLate).length,openN=S.tasks.filter(t=>!t.done).length;
 const rank=[...M].sort((a,b)=>rev(b,cur)-rev(a,cur)),top=rank[0];
 const max=Math.max(1,...ms.map(tot)),rmax=Math.max(1,rev(top,cur));
 const cols=ms.map(k=>{const t=tot(k);return `<div class="col${k===cur?' cur':''}"><span class="tot">${t?kEur(t):''}</span><div class="stackbar" style="height:${t/max*86}%">${M.map(m=>{const v=rev(m,k);return v?`<span style="background:${m.color};height:${v/t*100}%" data-tip="${esc(m.name)} · ${mL(k)}\n${eur(v)}"></span>`:''}).join('')}</div></div>`}).join('');
 const up=S.content.filter(c=>c.date>=T0&&c.date<=iso(addD(TODAY,7))).sort(cmpC).slice(0,6);
 const pr=S.tasks.filter(t=>!t.done).sort(cmpT).slice(0,5);
 const s=M.length>1?'s':'';
 return `<div class="head"><div><h1>${cap(mL(cur))} : ${eur(T)} de chiffre d’affaires</h1><p>${d==null?'Premier mois enregistré':`${d>=0?'+':''}${d} % par rapport à ${mL(pv)}`}${top&&rev(top,cur)?`, porté par ${esc(top.name)} (${eur(rev(top,cur))}).`:'.'}</p></div><div class="tools"><button class="btn" data-act="add-content">${sv(I.plus,18)}Contenu</button><button class="btn pri" data-act="add-model">${sv(I.plus,18)}Modèle</button></div></div>
 ${S.sample?'<p class="sample">Données d’exemple : modifiez-les, ou effacez tout depuis Réglages.</p>':''}
 <div class="kpis">
  <div class="card kpi hot"><small>CA brut, ${mL(cur)}</small><b>${eur(T)}</b>${dl(d,mS(pv))}</div>
  <div class="card kpi"><small>Part agence</small><b>${eur(C)}</b>${dl(pct(C,CP),mS(pv))}</div>
  <div class="card kpi"><small>Abonnés (hors pause)</small><b>${num(subs)}</b><span class="delta mutd">${M.length} modèle${s} gérée${s}</span></div>
  <div class="card kpi"><small>Tâches en retard</small><b class="${lateN?'late':''}">${lateN}</b><span class="delta mutd">${openN} à faire au total</span></div>
  <div class="card kpi"><small>Prospection en cours</small><b>${PA}</b><span class="delta mutd">${PP} réponse${PP>1?'s':''} positive${PP>1?'s':''} à suivre</span></div>
 </div>
 <div class="grid2">
  <section class="card"><h2>Revenus des 6 derniers mois</h2><div class="chart">${cols}</div><div class="months">${ms.map(k=>`<span>${mS(k)}</span>`).join('')}</div><div class="legend">${M.map(m=>`<span><i class="dot" style="--c:${m.color}"></i>${esc(m.name)}</span>`).join('')}</div></section>
  <section class="card"><h2>Classement de ${mL(cur)}</h2><div class="rank">${rank.map(m=>`<div class="rrow" style="--c:${m.color}"><span class="av sm">${ini(m.name)}</span><span>${esc(m.name)} ${dl(pct(rev(m,cur),rev(m,pv)))}</span><span class="num">${eur(rev(m,cur))}</span><span class="bar"><i style="width:${rev(m,cur)/rmax*100}%"></i></span></div>`).join('')}</div></section>
 </div>
 <div class="grid2 even">
  <section class="card"><h2>À venir cette semaine</h2>${up.length?up.map(c=>{const m=mdl(c.modelId)||GHOST;return `<div class="li" style="--c:${m.color}"><i class="dot"></i><div class="t">${esc(c.title)}<small>${esc(m.name)} · ${dShort(c.date)}${c.time?' à '+esc(c.time):''} · ${esc(c.type)}</small></div><span class="pill p-${c.status}">${CST[c.status]}</span></div>`}).join(''):'<p class="empty">Rien de programmé cette semaine.</p>'}<a class="more" href="#planning">Voir le planning →</a></section>
  <section class="card"><h2>Tâches prioritaires</h2>${pr.length?pr.map(taskRow).join(''):'<p class="empty">Tout est fait.</p>'}<a class="more" href="#taches">Toutes les tâches →</a></section>
 </div>`;
};

const gridHTML=()=>{
 const ms=months(),cur=ms[5],pv=ms[4],q=ui.q.trim().toLowerCase();
 const L=S.models.filter(m=>(ui.mf==='all'||m.status===ui.mf)&&(!q||[m.name,m.handle,m.niche,m.manager].join(' ').toLowerCase().includes(q)));

const afterRender=()=>{if(lineRO){lineRO.disconnect();lineRO=null}const s=$('#lineSvg');if(!s)return;if(window.ResizeObserver){lineRO=new ResizeObserver(drawLine);lineRO.observe(s)}else drawLine()};

const R={dashboard:vDash,modeles:vModels,prospection:vProspect,stats:vStats,planning:vPlan,taches:vTasks};
const root=$('#root');
root.innerHTML='<div id="shell"></div><div id="layer"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="tip" class="tip" aria-hidden="true"></div>';
const render=()=>{const late=S.tasks.filter(isLate).length;
 $('#shell').innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="logo">${sv(I.logo,18,'#fff')}</span><b>${esc(S.agency||'Mon Agence')}</b></div><nav>${Object.entries(VIEWS).map(([k,v])=>`<a href="#${k}" class="${k===ui.view?'on':''}" aria-label="${v}">${sv(I[k])}<span>${v}</span>${k==='taches'&&late?`<i class="badge">${late}</i>`:''}</a>`).join('')}</nav><div class="side-foot"><button class="ghost-side" data-act="settings" aria-label="Réglages">${sv(I.gear,18)}<span>Réglages</span></button><div id="save" class="save ${status}"><i></i><span>${SL[status]}</span></div></div></aside><main>${R[ui.view]()}</main></div>`;afterRender()};

/* ---------- panneaux ---------- */
const layer=()=>$('#layer');
const closeLayer=()=>{layer().innerHTML=''};
const openDrawer=(title,id,body,foot,head,tabs)=>{layer().innerHTML=`<div class="ov" data-act="close"></div><form class="drawer" id="${id}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dh${head?' hero':''}">${head||`<h2>${esc(title)}</h2>`}<button type="button" class="icon-btn" data-act="close" aria-label="Fermer">${sv(I.x)}</button>${tabs||''}</div><div class="db">${body}</div><div class="df">${foot}</div></form>`;const f=layer().querySelector('.db input:not([type=hidden]):not([type=radio]),.db textarea');if(f&&!head)f.focus()};
const F=(l,inner,full)=>`<label${full?' class="full"':''}>${l}${inner}</label>`;
const G=(l,inner,full)=>`<div class="fgroup${full?' full':''}"><span class="flabel">${l}</span>${inner}</div>`;
const inp=(n,v,t='text',x='')=>`<input class="field" name="${n}" type="${t}" value="${esc(v??'')}" ${x}>`;
const seg=(name,o,v,col)=>`<div class="seg" role="radiogroup">${Object.entries(o).map(([k,l])=>`<label class="opt"><input type="radio" name="${name}" value="${esc(k)}"${k===v?' checked':''}><span>${col?`<i class="dot" style="--c:${col[k]}"></i>`:''}${esc(l)}</span></label>`).join('')}</div>`;
const euroIn=(n,v,x='')=>`<span class="affix">${inp(n,v,'number',x)}<span>€</span></span>`;
const foot=(delAct,id,label)=>`${id?`<button type="button" class="linkdanger" data-act="${delAct}" data-id="${id}">${sv(I.trash,18)}Supprimer</button>`:''}<span class="sp"></span><button class="btn pri">${label||'Enregistrer'}</button>`;
const tabsH=t=>`<div class="tabs" role="tablist">${t.map(([k,l],i)=>`<button type="button" class="tab${i?'':' on'}" data-act="tab" data-v="${k}" role="tab">${l}</button>`).join('')}</div>`;
const STC={active:'#14a37f',onboarding:'#3d7bfd',pause:'#b0a7b1'};
const openModel=id=>{const m=id?mdl(id):{id:uid(),name:'',handle:'',niche:'',status:'onboarding',pct:40,price:9.99,subs:0,manager:'',start:T0,ig:'',tt:'',x:'',notes:'',rev:{},color:nextColor()};const ms=months();
 const head=`<span class="av lg" id="fmAv" style="--c:${m.color}">${ini(m.name)}</span><div class="hn"><input class="title-in" name="name" value="${esc(m.name)}" placeholder="Nom de la modèle" required autocomplete="off" aria-label="Nom"><label class="handle-in">@<input name="handle" value="${esc(m.handle)}" placeholder="pseudo_onlyfans" autocomplete="off" aria-label="Pseudo"></label></div>`;
 const body=`<input type="hidden" name="id" value="${m.id}">
 <div class="panel" data-p="p">
  ${G('Statut',seg('status',ST,m.status,STC),1)}
  ${F('Niche',inp('niche',m.niche,'text','placeholder="fitness, cosplay…"'))}${F('Manager',inp('manager',m.manager,'text','placeholder="Qui s’en occupe ?"'))}
  ${G('Part agence',`<div class="slider"><input type="range" name="pct" min="0" max="80" step="1" value="${+m.pct||0}" aria-label="Part agence en pourcentage"><output id="pctOut">${+m.pct||0} %</output></div><p class="hint" id="pctHint"></p>`,1)}
  ${F('Prix de l’abonnement',euroIn('price',m.price,'min="0" step="0.01"'))}${F('Abonnés',inp('subs',m.subs,'number','min="0" step="1"'))}
  ${F('Début de collaboration',inp('start',m.start,'date'))}
  ${G('Couleur',`<div class="swatches">${COLORS.map(c=>`<label class="sw"><input type="radio" name="color" value="${c}"${c===m.color?' checked':''} aria-label="Couleur ${c}"><span style="--c:${c}"></span></label>`).join('')}</div>`)}
 </div>
 <div class="panel" data-p="r" hidden><p class="hint">Chiffre d’affaires brut de chaque mois, tel qu’affiché sur OnlyFans.</p><div class="revlist">${ms.map(k=>`<div class="revrow"><span class="rm">${cap(mL(k))}</span>${euroIn('rev_'+k,(m.rev||{})[k]??'','min="0" step="1" inputmode="numeric" placeholder="0"')}<div class="rbar"><i></i></div></div>`).join('')}</div><div class="revtot"><span>Total sur 6 mois</span><b id="revTot"></b></div></div>
 <div class="panel" data-p="n" hidden>${F('Instagram',inp('ig',m.ig,'text','placeholder="pseudo"'))}${F('TikTok',inp('tt',m.tt,'text','placeholder="pseudo"'))}${F('X',inp('x',m.x,'text','placeholder="pseudo"'))}${F('Notes',`<textarea class="field" name="notes" rows="8" placeholder="Préférences, limites, idées de contenu…">${esc(m.notes)}</textarea>`,1)}</div>`;
 openDrawer(m.name||'Nouvelle modèle','fm',body,foot('delmodel',id,id?'Enregistrer':'Créer la fiche'),head,tabsH([['p','Profil'],['r','Revenus'],['n','Réseaux et notes']]));liveModel();if(!id)$('#fm [name=name]').focus()};
const liveModel=()=>{const f=$('#fm');if(!f)return;const d=new FormData(f),ms=months(),c=d.get('color')||COLORS[0],av=$('#fmAv');av.style.setProperty('--c',c);av.textContent=ini(d.get('name'))||'+';
 const p=+d.get('pct')||0,cv=+d.get('rev_'+ms[5])||0;$('#pctOut').textContent=p+' %';$('#pctHint').textContent=cv?`En ${mL(ms[5])} : ${eur(cv*p/100)} pour l’agence, ${eur(cv*(100-p)/100)} pour elle.`:`Sur 1 000 € de CA : ${eur(10*p)} pour l’agence, ${eur(10*(100-p))} pour elle.`;
 const vals=ms.map(k=>+d.get('rev_'+k)||0),mx=Math.max(1,...vals);f.querySelectorAll('.rbar i').forEach((i,j)=>{i.style.width=vals[j]/mx*100+'%';i.style.background=c});$('#revTot').textContent=eur(vals.reduce((a,b)=>a+b,0))};
const openContent=(id,date)=>{const c=id?byId(S.content,id):{id:uid(),modelId:ui.pf!=='all'?ui.pf:((S.models[0]||{}).id||''),date:date||T0,time:'18:00',type:'Post mur',title:'',price:'',status:'idee',note:''};
 openDrawer(id?'Modifier le contenu':'Nouveau contenu','fc',`<input type="hidden" name="id" value="${c.id}">
 ${F('Titre',inp('title',c.title,'text','required autocomplete="off" placeholder="ex. Teaser shooting"'),1)}
 ${G('Modèle',seg('modelId',{'':'Agence',...Object.fromEntries(S.models.map(m=>[m.id,m.name]))},c.modelId,{'':GHOST.color,...Object.fromEntries(S.models.map(m=>[m.id,m.color]))}),1)}
 ${G('Type',seg('type',Object.fromEntries(TYPES.map(t=>[t,t])),c.type),1)}
 ${F('Date',inp('date',c.date,'date','required'))}${F('Heure',inp('time',c.time,'time'))}
 ${F('Prix (si PPV)',euroIn('price',c.price,'min="0" step="0.01" placeholder="—"'))}
 ${G('Statut',seg('status',CST,c.status,CSC),1)}
 ${F('Note',`<textarea class="field" name="note" rows="3">${esc(c.note)}</textarea>`,1)}`,foot('delc',id,id?'Enregistrer':'Ajouter au planning'))};
const openTask=id=>{const t=byId(S.tasks,id);if(!t)return;
 openDrawer('Modifier la tâche','ft',`<input type="hidden" name="id" value="${t.id}">
 ${F('Tâche',inp('title',t.title,'text','required autocomplete="off"'),1)}
 ${F('Modèle',`<select class="field" name="modelId"><option value="">Agence (général)</option>${modelOpts(t.modelId)}</select>`)}${F('Responsable',inp('who',t.who))}
 ${F('Échéance',inp('due',t.due,'date'))}
 ${G('Priorité',seg('prio',PRIO,t.prio,{haute:'#ff4f6d',moyenne:'#f5a524',basse:'#b0a7b1'}),1)}
 <label class="agecard"><input type="checkbox" class="chk" name="done"${t.done?' checked':''}><span>Terminée</span></label>`,foot('deltask',id))};
const openProspect=id=>{const p=byId(S.prospects,id);if(!p)return;const m=mdl(p.modelId);
 const head=`<span class="av lg" style="--c:${PSC[p.stage]}">${sv(I.prospection,24)}</span><div class="hn"><label class="title-wrap">@<input class="title-in" name="handle" value="${esc(p.handle)}" required autocomplete="off" aria-label="Pseudo Instagram"></label><a class="instalink" href="https://www.instagram.com/${encodeURIComponent(p.handle)}/" target="_blank" rel="noopener">Voir le profil Instagram ↗</a></div>`;
 openDrawer('@'+p.handle,'fp',`<input type="hidden" name="id" value="${p.id}">
 ${G('Étape',seg('stage',PS,p.stage,PSC),1)}
 ${F('Prénom / nom',inp('name',p.name,'text','placeholder="Facultatif"'))}${F('Niche',inp('niche',p.niche,'text','placeholder="fitness, cosplay…"'))}
 ${F('Abonnés Instagram',inp('followers',p.followers||'','number','min="0" step="1" placeholder="ex. 25000"'))}${F('Relance prévue le',inp('followUp',p.followUp,'date'))}
 ${F('Dernier contact',inp('lastContact',p.lastContact,'date'))}
 <label class="agecard"><input type="checkbox" class="chk" name="ageOk"${p.ageOk?' checked':''}><span>Majeure vérifiée<small>Pièce d’identité vue. Obligatoire pour passer en Signée. Au moindre doute sur l’âge, ne va pas plus loin.</small></span></label>
 ${m?`<p class="hint">Fiche modèle liée : <b>${esc(m.name)}</b></p>`:''}
 ${F('Notes',`<textarea class="field" name="notes" rows="4" placeholder="Message envoyé, sa réponse, ses attentes…">${esc(p.notes)}</textarea>`,1)}`,foot('delp',id),head)};
const openSettings=()=>openDrawer('Réglages','fs',`${F('Nom de l’agence',inp('agency',S.agency,'text','required'),1)}
 <h3>Sauvegarde</h3><p class="hint">Copiez ce texte pour garder une copie de vos données, ou collez une sauvegarde pour la restaurer.</p>
 ${F('Exporter',`<textarea class="field" id="exp" rows="3" readonly>${esc(JSON.stringify(S))}</textarea>`,1)}<div class="full"><button type="button" class="btn" data-act="copy">Copier</button></div>
 ${F('Importer',`<textarea class="field" id="imp" rows="3" placeholder="Collez une sauvegarde ici"></textarea>`,1)}<div class="full"><button type="button" class="btn" data-act="import">Importer</button></div>
 <h3>Données</h3><div class="full"><button type="button" class="btn danger" data-act="reset">${sv(I.trash,18)}Tout effacer et repartir de zéro</button></div>`,`<span class="sp"></span><button type="button" class="btn" data-act="close">Fermer</button><button class="btn pri">Enregistrer</button>`);

/* ---------- événements ---------- */
D.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.type==='checkbox')return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='close')closeLayer();
 else if(a==='undo'){$('#toast').classList.remove('show');undo()}
 else if(a==='add-model')openModel();
 else if(a==='edit')openModel(id);
 else if(a==='add-content')openContent(null,b.dataset.date);
 else if(a==='editc')openContent(id);
 else if(a==='edittask')openTask(id);
 else if(a==='openp'){if(Date.now()-lastDrag>350)openProspect(id)}
 else if(a==='delp'){const p=byId(S.prospects,id);closeLayer();commit(()=>{S.prospects=S.prospects.filter(x=>x.id!==id)},`@${p?p.handle:''} retirée de la prospection`)}
 else if(a==='settings')openSettings();
 else if(a==='mf'||a==='tf'||a==='ss'||a==='sort'){ui[a==='sort'?'ss':a]=b.dataset.v;keepUI();render()}
 else if(a==='sp'){ui.sp=+b.dataset.v;keepUI();render()}
 else if(a==='togm'){hidden.has(id)?hidden.delete(id):hidden.add(id);if(hidden.size>=S.models.length)hidden.clear();render()}
 else if(a==='togall'){hidden.clear();render()}
 else if(a==='tab'){const f=b.closest('form');f.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));f.querySelectorAll('.panel').forEach(p=>p.hidden=p.dataset.p!==b.dataset.v)}
 else if(a==='delc'){const c=byId(S.content,id);closeLayer();commit(()=>{S.content=S.content.filter(x=>x.id!==id)},`« ${c?c.title:'Contenu'} » supprimé`)}
 else if(a==='deltask'){closeLayer();commit(()=>{S.tasks=S.tasks.filter(x=>x.id!==id)},'Tâche supprimée')}
 else if(a==='delmodel'){const m=mdl(id);closeLayer();commit(()=>{S.models=S.models.filter(x=>x.id!==id);S.content=S.content.filter(x=>x.modelId!==id);S.tasks=S.tasks.filter(x=>x.modelId!==id)},`${m?m.name:'Modèle'} supprimée, avec son planning et ses tâches`)}
 else if(a==='copy'){const t=$('#exp');const p=navigator.clipboard&&navigator.clipboard.writeText(t.value);(p||Promise.reject()).then(()=>toast('Sauvegarde copiée'),()=>{t.focus();t.select();toast('Texte sélectionné : copiez avec Ctrl+C')})}
 else if(a==='import'){try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.models)||!Array.isArray(d.content)||!Array.isArray(d.tasks))throw 0;closeLayer();commit(()=>{S=Object.assign({agency:'Mon Agence',prospects:[]},d)},'Sauvegarde importée')}catch(_){toast('Ce texte n’est pas une sauvegarde valide')}}
 else if(a==='reset'){closeLayer();commit(()=>{S.models=[];S.content=[];S.tasks=[];S.prospects=[];S.sample=false},'Toutes les données ont été effacées')}
});
D.addEventListener('change',e=>{const el=e.target,a=el.dataset.act,id=el.dataset.id;
 if(a==='toggle'){const t=byId(S.tasks,id);if(t)commit(()=>{t.done=el.checked},el.checked?'Tâche terminée':null)}
 else if(a==='cstatus'){const c=byId(S.content,id);if(c)commit(()=>{c.status=el.value})}
 else if(a==='pf'){ui.pf=el.value;keepUI();render()}
});
D.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;keepUI();$('#grid').innerHTML=gridHTML()}
 else if(e.target.id==='pq'){ui.pq=e.target.value;keepUI();$('#board').innerHTML=boardHTML()}
 else if(e.target.closest&&e.target.closest('#fm'))liveModel()});

/* glisser-déposer (souris partout sur la carte, tactile via la poignée) */
let drag=null,lastDrag=0;
const endDrag=()=>{if(!drag)return;if(drag.ghost)drag.ghost.remove();drag.card.classList.remove('dragging');D.querySelectorAll('.kcol.over').forEach(c=>c.classList.remove('over'));D.body.classList.remove('dragon');drag=null};
D.addEventListener('pointerdown',e=>{const card=e.target.closest('.pcard');if(!card||e.button>0||drag)return;const onGrip=!!e.target.closest('.grip');if(e.pointerType!=='mouse'&&!onGrip)return;drag={id:card.dataset.id,card,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false,over:null};if(onGrip)e.preventDefault()});
D.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;const r=drag.card.getBoundingClientRect();drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;const g=drag.card.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-act');g.style.width=r.width+'px';D.body.appendChild(g);drag.ghost=g;drag.card.classList.add('dragging');D.body.classList.add('dragon');drag.on=true}
 e.preventDefault();
 drag.ghost.style.transform=`translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px) rotate(2deg)`;
 const el=D.elementFromPoint(e.clientX,e.clientY),col=el&&el.closest('.kcol');
 if(col!==drag.over){if(drag.over)drag.over.classList.remove('over');drag.over=col;if(col)col.classList.add('over')}
 const b=$('#board');if(b){const r=b.getBoundingClientRect();if(e.clientX<r.left+60)b.scrollLeft-=14;else if(e.clientX>r.right-60)b.scrollLeft+=14}
 if(e.clientY<50)scrollBy(0,-12);else if(e.clientY>innerHeight-50)scrollBy(0,12);
},{passive:false});
D.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pid)return;if(!drag.on){drag=null;return}
 lastDrag=Date.now();const st=drag.over&&drag.over.dataset.stage,id=drag.id;endDrag();const p=st&&byId(S.prospects,id);if(p)moveTo(p,st)});
D.addEventListener('pointercancel',endDrag);

/* infobulles */
const hideTip=()=>{const el=$('#tip');if(el)el.classList.remove('on')};
const showTip=e=>{const el=$('#tip');if(!el)return;const t=e.target.closest?e.target.closest('[data-tip]'):null;if(!t||(drag&&drag.on))return hideTip();
 el.textContent=t.dataset.tip;const w=el.offsetWidth,h=el.offsetHeight;let x=e.clientX+14,y=e.clientY-h-12;if(x+w>innerWidth-8)x=e.clientX-w-14;if(x<8)x=8;if(y<8)y=e.clientY+18;el.style.transform=`translate(${x}px,${y}px)`;el.classList.add('on')};
D.addEventListener('pointermove',showTip);D.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')showTip(e)});
D.addEventListener('mouseleave',hideTip);addEventListener('scroll',hideTip,{passive:true});
D.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),tr=v=>String(v??'').trim();
 if(f.id==='fm'){const isNew=!mdl(d.id);commit(()=>{let m=mdl(d.id);if(!m){m={id:d.id,rev:{}};S.models.push(m)}
  Object.assign(m,{name:tr(d.name),handle:tr(d.handle).replace(/^@/,''),niche:tr(d.niche),status:d.status,manager:tr(d.manager),pct:+d.pct||0,price:+d.price||0,subs:+d.subs||0,start:d.start,color:d.color,ig:tr(d.ig),tt:tr(d.tt),x:tr(d.x),notes:d.notes||''});
  m.rev=m.rev||{};months().forEach(k=>{const v=d['rev_'+k];if(v===''||v==null)delete m.rev[k];else m.rev[k]=+v})},isNew?`${tr(d.name)} ajoutée`:'Fiche enregistrée');closeLayer()}
 else if(f.id==='fc'){const isNew=!byId(S.content,d.id);commit(()=>{let c=byId(S.content,d.id);if(!c){c={id:d.id};S.content.push(c)}Object.assign(c,{title:tr(d.title),modelId:d.modelId,type:d.type,date:d.date,time:d.time,price:d.price===''?'':+d.price,status:d.status,note:d.note||''})},isNew?'Contenu ajouté au planning':'Contenu enregistré');closeLayer()}
 else if(f.id==='ft'){const t=byId(S.tasks,d.id);if(t)commit(()=>{Object.assign(t,{title:tr(d.title),modelId:d.modelId,who:tr(d.who),due:d.due,prio:d.prio,done:!!d.done})},'Tâche enregistrée');closeLayer()}
 else if(f.id==='padd'){const hs=[...new Set(String(d.handles).split(/[\s,;]+/).map(cleanHandle).filter(Boolean))],ex=new Set(S.prospects.map(p=>p.handle)),nw=hs.filter(h=>!ex.has(h));
  if(!nw.length){toast(hs.length?'Ces profils sont déjà dans ta liste':'Aucun pseudo valide');return}
  const dup=hs.length-nw.length,s=nw.length>1?'s':'';
  commit(()=>{nw.forEach(h=>S.prospects.push({id:uid(),handle:h,name:'',followers:0,niche:'',stage:'a_contacter',moved:T0,added:T0,lastContact:'',followUp:'',ageOk:false,notes:''}))},`${nw.length} profil${s} ajouté${s}${dup?` (${dup} déjà présent${dup>1?'s':''})`:''}`);
  const q=$('#padd input');if(q)q.focus()}
 else if(f.id==='fp'){const p=byId(S.prospects,d.id);if(!p)return;const ageOk=!!d.ageOk;
  if(d.stage==='signee'&&!ageOk){toast('Coche « Majeure vérifiée » avant de la passer en Signée');return}
  let x='';commit(()=>{Object.assign(p,{handle:cleanHandle(d.handle)||p.handle,name:tr(d.name),followers:+d.followers||0,niche:tr(d.niche),lastContact:d.lastContact,followUp:d.followUp,ageOk,notes:d.notes||''});x=applyStage(p,d.stage)},()=>'Fiche enregistrée'+x);closeLayer()}
 else if(f.id==='fs'){commit(()=>{S.agency=tr(d.agency)||'Mon Agence'},'Réglages enregistrés');closeLayer()}
 else if(f.id==='qadd'){commit(()=>{S.tasks.push({id:uid(),title:tr(d.title),modelId:d.modelId,due:d.due,prio:d.prio,who:'',done:false})},'Tâche ajoutée');const q=$('#qadd input[name=title]');if(q)q.focus()}
});
D.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer().innerHTML)closeLayer()});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==ui.view){ui.view=v;keepUI();closeLayer();render();scrollTo(0,0)}});

render();
(async()=>{try{art=window.claude&&window.claude.use?await window.claude.use('artifact'):null}catch(e){art=null}
 if(art){setStatus('ok');if(dirty)schedule()}else setStatus('local')})();
}</script>
