<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" data-keep>
<meta name="theme-color" content="#0b0713" data-keep>
<meta name="viewport" content="width=device-width, initial-scale=1" data-keep>
<title data-keep>Gestion des modèles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-keep>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" data-keep>
<style data-keep>
/* VOICE: back-office d'agence haut de gamme, nocturne, calme et précis
   IDEA: un salon privé la nuit — verre fumé posé sur des lueurs violettes et magenta
   PICTURE: panneaux de verre translucides, lueurs diffuses en fond, chiffres clés en dégradé
   COLOUR: nuit violette #0b0713, verre blanc 4–8 %, magenta #e040fb → violet #8b5cf6 en accent
   TYPE: Outfit pour titres et chiffres, Inter pour le texte. LAYOUT: barre latérale vitrée + contenu en cartes */
:root{color-scheme:dark;--bg:#0b0713;--panel:#150d22;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.075);--stroke:rgba(255,255,255,.09);--stroke2:rgba(255,255,255,.18);--ink:#f5f0fb;--mute:#a597ba;--line:rgba(255,255,255,.08);--acc:#e040fb;--acc2:#8b5cf6;--grad:linear-gradient(135deg,#e040fb 0%,#a855f7 50%,#7c3aed 100%);--accInk:#f0abfc;--soft:rgba(224,64,251,.14);--ok:#4ade80;--okbg:rgba(74,222,128,.13);--warn:#fcd34d;--warnbg:rgba(251,191,36,.13);--blue:#a5b4fc;--bluebg:rgba(129,140,248,.15);--r:20px;--glow:0 18px 50px -18px rgba(224,64,251,.55)}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh;background:radial-gradient(1100px 650px at 88% -8%,rgba(224,64,251,.20),transparent 60%),radial-gradient(900px 640px at -12% 35%,rgba(124,58,237,.22),transparent 62%),radial-gradient(800px 520px at 55% 115%,rgba(236,72,153,.12),transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;letter-spacing:-.01em}
h1{font-size:clamp(28px,3.4vw,40px);line-height:1.08;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0 0 16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(224,64,251,.35)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* barre latérale */
.side{background:rgba(16,9,28,.55);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border-right:1px solid var(--stroke);padding:24px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;font:700 18px Outfit,sans-serif}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:var(--glow)}
nav{display:flex;flex-direction:column;gap:4px}
nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:500;min-height:46px;transition:background .15s,color .15s}
nav a:hover{background:var(--glass);color:var(--ink)}
nav a.on{background:linear-gradient(90deg,rgba(224,64,251,.20),rgba(139,92,246,.06));color:#fff;box-shadow:inset 0 0 0 1px rgba(224,64,251,.22)}
nav a.on::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
nav a.on svg{color:var(--accInk)}
.badge{margin-left:auto;background:var(--grad);color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.ghost-side{background:var(--glass);border:1px solid var(--stroke);color:var(--ink);border-radius:12px;padding:0 14px;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:46px;transition:background .15s}
.ghost-side:hover{background:var(--glass2)}
.save{font-size:13px;color:var(--mute);padding:0 8px;display:flex;align-items:center;gap:8px}
.save i{width:8px;height:8px;border-radius:50%;background:#6b6080;flex:none}
.save.ok i,.save.local i{background:var(--ok);box-shadow:0 0 10px var(--ok)}.save.saving i{background:var(--warn);box-shadow:0 0 10px var(--warn)}.save.err i,.save.ro i{background:var(--acc)}
/* contenu */
main{padding:clamp(20px,3.6vw,48px);max-width:1320px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 20px;margin-bottom:28px}
.head p{margin:8px 0 0;color:var(--mute);font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s,transform .1s,box-shadow .2s}
.btn:hover{background:var(--glass2);border-color:var(--stroke2)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.pri:hover{box-shadow:0 22px 60px -16px rgba(224,64,251,.75),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.06)}
.btn.danger{color:var(--accInk)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;border:0;background:none;cursor:pointer;color:var(--mute);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--glass2);color:var(--ink)}
.field,.sel,.search input{min-height:46px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);border-radius:12px;padding:0 14px;font-size:16px;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
.field::placeholder,.search input::placeholder{color:#7d7092}
.field:hover,.sel:hover,.search input:hover{border-color:var(--stroke2)}
.field:focus,.sel:focus,.search input:focus{outline:none;border-color:rgba(224,64,251,.6);box-shadow:0 0 0 4px rgba(224,64,251,.15);background:rgba(255,255,255,.06)}
select.field,.sel{cursor:pointer}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
option{background:#1a1029;color:var(--ink)}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.8);cursor:pointer}
.search{position:relative;display:block}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}.search input{padding-left:42px;width:min(280px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--stroke);background:var(--glass);cursor:pointer;font-weight:500;color:var(--ink);transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--stroke2)}
.chip span{color:var(--mute)}.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 24px -10px rgba(224,64,251,.6)}.chip.on span{color:#fff;opacity:.8}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--stroke);border-radius:var(--r);padding:22px;backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 60px -36px rgba(0,0,0,.9)}
.sample{font-size:13px;color:var(--mute);margin:-16px 0 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px;margin-bottom:16px}
.kpi small{color:var(--mute);font-size:13px;display:block}
.kpi b{display:block;font:700 clamp(26px,2.8vw,32px)/1.15 Outfit,sans-serif;margin:8px 0 4px;white-space:nowrap;letter-spacing:-.01em}
.delta{font-size:13px;font-weight:600;white-space:nowrap}.up{color:var(--ok)}.down{color:#fb7185}.mutd{color:var(--mute);font-weight:500}
.kpi.hot{background:var(--grad);border-color:rgba(255,255,255,.18);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.3);color:#fff}
.kpi.hot small,.kpi.hot .delta{color:#fff;opacity:.92}
.kpi.hot::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(400px 140px at 90% 0%,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.chart{display:flex;align-items:flex-end;gap:clamp(8px,2vw,22px);height:260px;border-bottom:1px solid var(--line)}
.chart.big{height:300px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col .tot{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:6px;white-space:nowrap}.col.cur .tot{color:var(--ink)}
.stackbar{width:min(52px,100%);display:flex;flex-direction:column-reverse;border-radius:10px 10px 3px 3px;overflow:hidden;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1)}
.col.cur .stackbar{box-shadow:0 0 30px -6px rgba(224,64,251,.55)}
.stackbar span{display:block;border-top:1px solid rgba(11,7,19,.6);transition:filter .15s;cursor:pointer}.stackbar span:hover{filter:brightness(1.2) saturate(1.15)}
.months{display:flex;gap:clamp(8px,2vw,22px);margin-top:10px}.months span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px;color:var(--mute)}.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block;box-shadow:0 0 10px -2px var(--c)}
.rank{display:flex;flex-direction:column;gap:16px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.rrow .bar{grid-column:2/4;height:6px;background:var(--line);border-radius:9px;overflow:hidden}.rrow .bar i{display:block;height:100%;background:var(--c);border-radius:9px;box-shadow:0 0 12px var(--c)}
.av{width:44px;height:44px;border-radius:14px;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 55%),var(--c);color:#fff;display:grid;place-items:center;font:700 15px Outfit,sans-serif;flex:none;box-shadow:0 10px 24px -10px var(--c),inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.av.sm{width:32px;height:32px;border-radius:10px;font-size:12px;grid-row:span 2}
.num{white-space:nowrap;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .t{flex:1}.li small{color:var(--mute);display:block;font-size:13px}
.more{display:inline-flex;margin-top:14px;color:var(--accInk);font-weight:600;text-decoration:none;font-size:14px}.more:hover{color:#fff}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mute);white-space:nowrap;border:1px solid transparent}
.p-active,.p-publie{background:var(--okbg);color:var(--ok)}.p-onboarding,.p-programme{background:var(--bluebg);color:var(--blue)}
.p-pret,.p-moyenne,.p-relancer{background:var(--warnbg);color:var(--warn)}.p-haute{background:var(--soft);color:var(--accInk)}
/* modèles */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:18px;transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}
.mcard::before{content:"";position:absolute;inset:-1px -1px auto;height:120px;background:radial-gradient(300px 120px at 20% 0%,var(--c),transparent 70%);opacity:.16;pointer-events:none}
.mcard:hover{transform:translateY(-3px);border-color:var(--stroke2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 60px -30px var(--c)}
.cover{position:absolute;inset:0;border:0;background:none;border-radius:var(--r);cursor:pointer;z-index:1}
.mtop{display:flex;align-items:center;gap:12px}.who{flex:1}.who b{display:block;font:600 17px Outfit,sans-serif}.who small{color:var(--mute)}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mstats small{display:block;color:var(--mute);font-size:12px}.mstats b{display:block;font:700 19px Outfit,sans-serif;white-space:nowrap}
.spark{display:flex;align-items:flex-end;gap:4px;height:44px}.spark i{flex:1;background:var(--c);opacity:.28;border-radius:4px 4px 1px 1px}.spark i:last-child{opacity:1;box-shadow:0 0 14px -2px var(--c)}
.mfoot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
/* planning */
.warnbox{border-color:rgba(224,64,251,.45);margin-bottom:16px;box-shadow:0 0 0 1px rgba(224,64,251,.15),0 20px 50px -30px rgba(224,64,251,.5)}
.day{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:20px 0;border-top:1px solid var(--line)}.day:first-child{border-top:0;padding-top:0}.day:last-child{padding-bottom:0}
.dlabel b{display:block;font:700 36px/1 Outfit,sans-serif}.dlabel small{color:var(--mute)}
.day.today .dlabel b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:4px auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:8px 8px 8px 0;overflow:hidden;transition:border-color .15s,background .15s}
.item:hover{background:var(--glass2);border-color:var(--stroke2)}
.item .stripe{align-self:stretch;background:var(--c);margin:-8px 0;box-shadow:0 0 14px var(--c)}
.item time{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:Outfit,sans-serif}
.item .t b{display:block;font-weight:600}.item .t small{color:var(--mute)}
.act{display:flex;align-items:center;gap:2px}
.stsel{min-height:36px;border:1px solid transparent;border-radius:10px;padding:0 8px;font-size:13px;font-weight:600;cursor:pointer;margin-right:4px}
.none{margin:0;color:var(--mute);font-size:14px}
.addday{align-self:flex-start;background:none;border:1px dashed var(--stroke2);border-radius:10px;color:var(--mute);min-height:36px;padding:0 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:14px;transition:color .15s,border-color .15s}
.addday:hover{color:var(--accInk);border-color:var(--acc)}
.empty{color:var(--mute);text-align:center;padding:40px 16px;margin:0}
/* tâches */
.quick{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto auto;gap:10px;margin-bottom:20px;padding:14px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}
.chk{width:22px;height:22px;accent-color:var(--acc);cursor:pointer;margin:0 0 0 2px;flex:none}
.tt{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500;display:block;color:var(--ink)}.tt:hover{color:var(--accInk)}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.tm{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center}.tm span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.late{color:#fb7185;font-weight:600}
/* panneau latéral */
.ov{position:fixed;inset:0;background:rgba(5,2,10,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;animation:fade .2s}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(560px,calc(100% - 24px));background:linear-gradient(180deg,rgba(32,20,52,.86),rgba(18,11,30,.92));backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--stroke2);border-radius:24px;z-index:21;display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 40px 100px -30px rgba(0,0,0,.9),0 0 80px -40px rgba(224,64,251,.5),inset 0 1px 0 rgba(255,255,255,.08);margin:0;overflow:hidden}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 16px 18px 24px;border-bottom:1px solid var(--line)}.dh h2{margin:0;font-size:22px}
.db{padding:24px;overflow:auto;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;align-content:start}
.db label{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:var(--mute)}
.db .full,.db h3,.revs,.hint{grid-column:1/-1}
.db .field{width:100%;font-weight:400}
textarea.field{min-height:100px;padding:12px 14px;resize:vertical;line-height:1.5}
.db h3{margin:8px 0 0;font-size:15px}
.hint{margin:0;color:var(--mute);font-size:14px}
.checkline{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:15px!important}
.df{display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap;background:rgba(255,255,255,.02)}.df .sp{flex:1}
.dh.hero{align-items:flex-start;gap:16px;padding:24px 16px 0 24px;flex-wrap:wrap;background:radial-gradient(500px 200px at 0% 0%,rgba(224,64,251,.14),transparent 70%)}
.dh.hero:not(:has(.tabs)){padding-bottom:20px}
.av.lg{width:60px;height:60px;border-radius:18px;font-size:21px;transition:background .25s}
.hn{flex:1;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.title-in{font:700 24px/1.2 Outfit,sans-serif;border:0;background:none;padding:4px 8px;margin-left:-8px;border-radius:10px;width:100%;color:var(--ink);transition:background .15s}
.title-in::placeholder{color:#7d7092}
.title-in:hover,.title-in:focus,.handle-in input:hover,.handle-in input:focus{background:rgba(255,255,255,.06);outline:none}
.title-wrap{display:flex!important;flex-direction:row!important;align-items:center;font:700 24px Outfit,sans-serif!important;color:var(--mute)!important}.title-wrap .title-in{margin-left:0}
.handle-in{display:flex!important;flex-direction:row!important;align-items:center;color:var(--mute);font-size:15px}.handle-in input{border:0;background:none;padding:4px 6px;color:var(--mute);width:100%;font-size:15px;border-radius:8px}.handle-in input:focus{color:var(--ink)}
.tabs{display:flex;gap:4px;width:100%;margin:14px 0 0 -6px;overflow-x:auto}
.tab{background:none;border:0;padding:0 14px;min-height:46px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s}.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-image:var(--grad) 1;border-bottom:2px solid}
.panel{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;align-content:start}.panel[hidden]{display:none}
.fgroup{display:flex;flex-direction:column;gap:10px}.fgroup.full{grid-column:1/-1}.flabel{font-size:13px;font-weight:600;color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.db .opt{display:inline-flex;flex-direction:row;position:relative;font-size:14px;color:var(--ink);gap:0}
.opt input,.sw input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{min-height:40px;padding:0 15px;border-radius:99px;border:1px solid var(--stroke);display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;background:rgba(255,255,255,.04);transition:background .15s,border-color .15s,box-shadow .15s}
.opt span:hover{border-color:var(--stroke2);background:rgba(255,255,255,.07)}
.opt input:checked+span{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 24px -10px rgba(224,64,251,.7)}
.opt input:checked+span .dot{background:#fff;box-shadow:none}
.opt input:focus-visible+span,.sw input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:4px}.db .sw{display:block;position:relative}

/* ---------- synchronisation Supabase ---------- */
let status='ok',prev=null,synced=null,syncing=false,again=false;
const SL={wait:'Connexion…',ok:'Synchronisé',saving:'Enregistrement…',err:'Erreur de synchro'};
const setStatus=s=>{status=s;const el=$('#save');if(el){el.className='save '+s;el.innerHTML='<i></i><span>'+SL[s]+'</span>'}};
const rowOf={
 models:m=>{const{id,email,notes,_linked,...d}=m;return{id,email:email||null,data:d}},
 model_private:m=>({id:m.id,data:{notes:m.notes||''}}),
 content:c=>{const{id,...d}=c;return{id,model_id:c.modelId||null,data:d}},
 tasks:t=>{const{id,shared,...d}=t;return{id,model_id:t.modelId||null,shared:!!shared,data:d}},
 prospects:p=>{const{id,...d}=p;return{id,data:d}}};
const SRC={models:'models',model_private:'models',content:'content',tasks:'tasks',prospects:'prospects'};
const ORDER=['models','model_private','content','tasks','prospects'];
const snap=()=>{const o={settings:JSON.stringify({agency:S.agency})};for(const t of ORDER)o[t]=Object.fromEntries(S[SRC[t]].map(x=>{const r=rowOf[t](x);return[r.id,JSON.stringify(r)]}));return o};
const sync=async()=>{if(mode!=='admin'||!synced)return;if(syncing){again=true;return}syncing=true;setStatus('saving');let relink=[];
 try{do{again=false;const cur=snap();
  if(cur.settings!==synced.settings){const r=await sb.from('settings').upsert({id:1,data:JSON.parse(cur.settings)});if(r.error)throw r.error}
  for(const t of ORDER){const up=[],del=[];for(const id in cur[t])if(cur[t][id]!==synced[t][id])up.push(JSON.parse(cur[t][id]));for(const id in synced[t])if(!(id in cur[t]))del.push(id);
   if(up.length){const r=await sb.from(t).upsert(up);if(r.error)throw r.error;if(t==='models')relink.push(...up.map(x=>x.id))}
   if(del.length&&t!=='model_private'){const r=await sb.from(t).delete().in('id',del);if(r.error)throw r.error}}
  synced=cur}while(again);
  if(relink.length){const r=await sb.from('models').select('id,user_id').in('id',relink);if(!r.error){let ch=false;for(const x of r.data){const m=mdl(x.id);if(m&&m._linked!==!!x.user_id){m._linked=!!x.user_id;ch=true}}if(ch&&!$('#layer').innerHTML)render()}}
  setStatus('ok')}
 catch(e){console.error(e);setStatus('err');toast('Erreur d’enregistrement : '+(e.message||e))}
 finally{syncing=false}};
const commit=(fn,msg)=>{if(mode!=='admin')return;prev=JSON.stringify(S);fn();render();if(typeof msg==='function')msg=msg();if(msg)toast(msg,true);sync()};
const undo=()=>{if(!prev)return;S=JSON.parse(prev);prev=null;render();toast('Action annulée');sync()};
let tT;const toast=(m,u)=>{const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>${u?'<button data-act="undo">Annuler</button>':''}`;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),5000)};

 <div class="kpis">
  <div class="card kpi hot"><small>CA brut, ${mL(cur)}</small><b>${eur(T)}</b>${dl(d,mS(pv))}</div>
  <div class="card kpi"><small>Part agence</small><b>${eur(C)}</b>${dl(pct(C,CP),mS(pv))}</div>
  <div class="card kpi"><small>Abonnés (hors pause)</small><b>${num(subs)}</b><span class="delta mutd">${M.length} modèle${s} gérée${s}</span></div>
  <div class="card kpi"><small>Tâches en retard</small><b class="${lateN?'late':''}">${lateN}</b><span class="delta mutd">${openN} à faire au total</span></div>
  <div class="card kpi"><small>Prospection en cours</small><b>${PA}</b><span class="delta mutd">${PP} réponse${PP>1?'s':''} positive${PP>1?'s':''} à suivre</span></div>
 </div>
 <div class="grid2">
  <section class="card"><h2>Revenus des 6 derniers mois</h2><div class="chart">${cols}</div><div class="months">${ms.map(k=>`<span>${mS(k)}</span>`).join('')}</div><div class="legend">${M.map(m=>`<span><i class="dot" style="--c:${m.color}"></i>${esc(m.name)}</span>`).join('')}</div></section>

 </div>

const loadTeam=async()=>{if(teamLoading)return;teamLoading=true;try{const[a,i]=await Promise.all([sb.rpc('list_accounts'),sb.from('admin_invites').select('email,created_at')]);if(a.error)throw a.error;if(i.error)throw i.error;team={accounts:a.data||[],invites:i.data||[]}}catch(e){team={error:String(e.message||e)}}teamLoading=false;if(ui.view==='equipe'&&mode==='admin')render()};
const askConfirm=(title,txt,ok,fn,danger)=>{pendingConfirm=fn;layer().innerHTML=`<div class="ov" data-act="close"></div><div class="modal card" role="alertdialog" aria-modal="true" aria-label="${esc(title)}"><h2>${title}</h2><p class="hint">${txt}</p><div class="authactions"><button type="button" class="btn" data-act="close">Annuler</button><button type="button" class="btn ${danger?'dangerbtn':'pri'}" data-act="confirm">${ok}</button></div></div>`;const b=$('.modal [data-act=confirm]');if(b)b.focus()};
const vTeam=()=>{const me=session.user.id;
 if(!team){loadTeam();return `<div class="head"><div><h1>Équipe</h1><p>Chargement des comptes…</p></div></div><div class="card"><div class="loader"></div></div>`}
 if(team.error)return `<div class="head"><div><h1>Équipe</h1></div></div><div class="card"><p class="empty">${/function|does not exist|schema cache/i.test(team.error)?'Relance le script <code>supabase/setup.sql</code> dans Supabase pour activer la gestion de l’équipe.':'Erreur : '+esc(team.error)}</p><button class="btn" data-act="reloadteam">Réessayer</button></div>`;
 const A=team.accounts,adm=A.filter(a=>a.role==='admin'),mod=A.filter(a=>a.role!=='admin');
 const row=a=>{const self=a.id===me,isA=a.role==='admin';return `<div class="acct"><span class="av sm" style="--c:${isA?'#e040fb':'#818cf8'}">${esc((a.email||'?')[0].toUpperCase())}</span><div class="acct-t"><b>${esc(a.email)}${self?' <span class="pill">Toi</span>':''}</b><small>${isA?'Admin : accès à toute l’agence':a.model_name?`Modèle, fiche : ${esc(a.model_name)}`:'Compte sans fiche reliée'} · créé le ${new Date(a.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</small></div>${self?'':isA?`<button class="btn sm" data-act="setrole" data-id="${a.id}" data-v="model">Retirer admin</button>`:`<button class="btn sm pri" data-act="setrole" data-id="${a.id}" data-v="admin">Passer admin</button>`}</div>`};
 return `<div class="head"><div><h1>Équipe</h1><p>${adm.length} admin${adm.length>1?'s':''} · ${mod.length} compte${mod.length>1?'s':''} modèle${mod.length>1?'s':''}${team.invites.length?` · ${team.invites.length} invitation${team.invites.length>1?'s':''} en attente`:''}</p></div><button class="btn" data-act="reloadteam">Actualiser</button></div>
 <form class="padd card" id="fadmin"><input class="field" type="email" name="email" required placeholder="Email de la personne à nommer admin" autocomplete="off" aria-label="Email du nouvel admin"><button class="btn pri">${sv(I.equipe,18)}Nommer admin</button></form>
 <p class="hint" style="margin:-6px 0 20px">Si elle a déjà un compte, elle devient admin tout de suite. Sinon, elle le deviendra dès qu’elle créera son compte sur le site avec cet email. Un admin voit et modifie tout : modèles, revenus, prospection, équipe.</p>
 ${team.invites.length?`<section class="card" style="margin-bottom:16px"><h2>Invitations en attente</h2>${team.invites.map(i=>`<div class="acct"><span class="av sm" style="--c:#6b6080">${esc(i.email[0].toUpperCase())}</span><div class="acct-t"><b>${esc(i.email)}</b><small>Deviendra admin à la création de son compte</small></div><button class="btn sm" data-act="revinv" data-v="${esc(i.email)}">Annuler</button></div>`).join('')}</section>`:''}
 <section class="card" style="margin-bottom:16px"><h2>Admins</h2>${adm.map(row).join('')}</section>
 <section class="card"><h2>Comptes modèles</h2>${mod.length?mod.map(row).join(''):'<p class="empty">Aucune modèle n’a encore créé son compte.</p>'}</section>`};

const R={equipe:vTeam,dashboard:vDash,modeles:vModels,prospection:vProspect,stats:vStats,planning:vPlan,taches:vTasks,accueil:vMHome,mplanning:vMPlan,revenus:vMRev,mtaches:vMTasks};
const root=$('#root');
root.innerHTML='<div id="shell"></div><div id="layer"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="tip" class="tip" aria-hidden="true"></div>';
const render=()=>{if(!mode)return;const late=mode==='admin'?S.tasks.filter(isLate).length:S.tasks.filter(t=>!t.done).length;const em=session&&session.user.email||'';
 $('#shell').innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="logo">${sv(I.logo,18,'#fff')}</span><b>${esc(S.agency||'Mon Agence')}</b></div>${mode==='model'?`<div class="whoami"><span class="av sm" style="--c:${myModel.color}">${ini(myModel.name)}</span><span><b>${esc(myModel.name)}</b><small>Espace modèle</small></span></div>`:''}<nav>${Object.entries(VIEWS).map(([k,v])=>`<a href="#${k}" class="${k===ui.view?'on':''}" aria-label="${v}">${sv(I[k])}<span>${v}</span>${(k==='taches'||k==='mtaches')&&late?`<i class="badge">${late}</i>`:''}</a>`).join('')}</nav><div class="side-foot">${mode==='admin'?`<button class="ghost-side" data-act="settings" aria-label="Réglages">${sv(I.gear,18)}<span>Réglages</span></button>`:''}<div class="userline"><span title="${esc(em)}">${esc(em)}</span><button class="icon-btn" data-act="logout" aria-label="Se déconnecter" title="Se déconnecter">${sv(I.logout,18)}</button></div>${mode==='admin'?`<div id="save" class="save ${status}"><i></i><span>${SL[status]}</span></div>`:''}</div></aside><main>${R[ui.view]()}</main></div>`;afterRender()};

/* ---------- connexion ---------- */
let authMode='login';
const screen=inner=>{mode=null;closeLayer();$('#shell').innerHTML=`<div class="auth"><div class="authcard card">${inner}</div></div>`};
const brandH=sub=>`<div class="authbrand"><span class="logo">${sv(I.logo,20,'#fff')}</span><div><b>${esc(S.agency&&S.agency!=='Mon Agence'?S.agency:'Espace agence')}</b><small>${sub}</small></div></div>`;
const renderAuth=(m,msg,ok)=>{authMode=m||authMode;const A={login:['Connexion','Se connecter'],signup:['Créer mon compte','Créer mon compte'],forgot:['Mot de passe oublié','Recevoir le lien'],reset:['Nouveau mot de passe','Enregistrer']}[authMode];
 screen(`${brandH('Agence et modèles')}${authMode==='login'||authMode==='signup'?`<div class="authtabs"><button type="button" class="${authMode==='login'?'on':''}" data-act="auth" data-v="login">Connexion</button><button type="button" class="${authMode==='signup'?'on':''}" data-act="auth" data-v="signup">Créer mon compte</button></div>`:`<h2>${A[0]}</h2>`}
 <form id="fauth" class="authform">${authMode!=='reset'?`<label>Email<input class="field" type="email" name="email" required autocomplete="email" placeholder="ton@email.com"></label>`:''}${authMode!=='forgot'?`<label>Mot de passe<input class="field" type="password" name="password" required minlength="8" autocomplete="${authMode==='login'?'current-password':'new-password'}" placeholder="${authMode==='login'?'••••••••':'8 caractères minimum'}"></label>`:''}
 ${msg?`<p class="authmsg${ok?' ok':''}">${msg}</p>`:''}<button class="btn pri big">${A[1]}</button></form>
 ${authMode==='login'?'<button type="button" class="authlink" data-act="auth" data-v="forgot">Mot de passe oublié ?</button>':''}${authMode==='forgot'?'<button type="button" class="authlink" data-act="auth" data-v="login">← Retour à la connexion</button>':''}
 ${authMode==='signup'?'<p class="hint">Modèle : utilise l’email que ton agence a enregistré pour toi, ton espace s’ouvrira automatiquement.</p>':''}`);
 const f=$('#fauth input');if(f)f.focus()};
const authErr=e=>{const m=String(e&&e.message||e);return /Invalid login/i.test(m)?'Email ou mot de passe incorrect.':/not confirmed/i.test(m)?'Confirme d’abord ton email : clique sur le lien reçu par mail.':/already registered|already exists/i.test(m)?'Un compte existe déjà avec cet email. Connecte-toi.':/Password should be|at least/i.test(m)?'Mot de passe trop court (8 caractères minimum).':/rate limit|too many/i.test(m)?'Trop de tentatives. Réessaie dans quelques minutes.':/fetch|network/i.test(m)?'Connexion au serveur impossible. Vérifie ta connexion internet.':esc(m)};
const doAuth=async d=>{const btn=$('#fauth button.pri');if(btn){btn.disabled=true;btn.textContent='Un instant…'}const back=location.origin+location.pathname;
 try{if(authMode==='login'){const r=await sb.auth.signInWithPassword({email:d.email.trim(),password:d.password});if(r.error)throw r.error;await start(r.data.session)}
  else if(authMode==='signup'){const r=await sb.auth.signUp({email:d.email.trim(),password:d.password,options:{emailRedirectTo:back}});if(r.error)throw r.error;if(r.data.session)await start(r.data.session);else renderAuth('login','Compte créé. Ouvre le mail de confirmation que tu viens de recevoir, puis connecte-toi ici.',1)}
  else if(authMode==='forgot'){const r=await sb.auth.resetPasswordForEmail(d.email.trim(),{redirectTo:back});if(r.error)throw r.error;renderAuth('login','Si un compte existe avec cet email, tu vas recevoir un lien pour choisir un nouveau mot de passe.',1)}
  else if(authMode==='reset'){const r=await sb.auth.updateUser({password:d.password});if(r.error)throw r.error;history.replaceState(null,'',location.pathname);const s=(await sb.auth.getSession()).data.session;await start(s);toast('Mot de passe modifié')}}
 catch(e){renderAuth(authMode,authErr(e))}};
const renderSetup=()=>screen(`${brandH('Configuration')}<h2>Il reste une étape</h2><p class="hint">Le site n’est pas encore relié à sa base de données. Suis le guide <b>SETUP.md</b> du dépôt GitHub, puis renseigne l’adresse et la clé publique de ton projet Supabase dans <code>config.js</code>.</p>`);
const renderMsg=(title,txt,actions)=>screen(`${brandH(session?esc(session.user.email):'')}<h2>${title}</h2><p class="hint">${txt}</p><div class="authactions">${actions||''}<button type="button" class="btn" data-act="logout">${sv(I.logout,18)}Se déconnecter</button></div>`);

/* ---------- chargement ---------- */
const must=r=>{if(r.error)throw r.error;return r.data};
const load=async()=>{
 if(mode==='admin'){const[st,mo,pr,co,ta,ps]=await Promise.all([sb.from('settings').select('data').eq('id',1).maybeSingle(),sb.from('models').select('id,email,user_id,data'),sb.from('model_private').select('id,data'),sb.from('content').select('id,data'),sb.from('tasks').select('id,shared,data'),sb.from('prospects').select('id,data')].map(p=>p.then(must)));
  const pv=Object.fromEntries(pr.map(r=>[r.id,r.data||{}]));
  S={agency:(st&&st.data&&st.data.agency)||'Mon Agence',models:mo.map(r=>({...r.data,id:r.id,email:r.email||'',_linked:!!r.user_id,notes:(pv[r.id]||{}).notes||''})),content:co.map(r=>({...r.data,id:r.id})),tasks:ta.map(r=>({...r.data,id:r.id,shared:r.shared})),prospects:ps.map(r=>({...r.data,id:r.id}))};
  synced=snap()}
 else{const[st,mo,co,ta]=await Promise.all([sb.from('settings').select('data').eq('id',1).maybeSingle(),sb.from('models').select('id,data').eq('user_id',session.user.id),sb.from('content').select('id,data'),sb.from('tasks').select('id,shared,data')].map(p=>p.then(must)));
  S={agency:(st&&st.data&&st.data.agency)||'Mon Agence',models:mo.map(r=>({...r.data,id:r.id})),content:co.map(r=>({...r.data,id:r.id})),tasks:ta.map(r=>({...r.data,id:r.id,shared:r.shared})),prospects:[]};
  myModel=S.models[0]||null}};
const start=async s=>{session=s;if(!s)return renderAuth('login');
 screen(`${brandH('Chargement…')}<div class="loader"></div>`);
 try{const p=await sb.from('profiles').select('role').eq('id',s.user.id).maybeSingle();if(p.error)throw p.error;
  const role=p.data&&p.data.role;if(!role)return renderMsg('Compte en cours de création','Ton profil n’est pas encore prêt. Recharge la page dans un instant.','<button type="button" class="btn pri" data-act="reload">Recharger</button>');
  mode=role==='admin'?'admin':'model';await load();
  if(mode==='model'&&!myModel){mode=null;return renderMsg('Ton espace n’est pas encore ouvert',`Ton compte <b>${esc(s.user.email)}</b> fonctionne, mais aucune fiche modèle n’utilise encore cet email. Demande à ton agence d’ajouter exactement cette adresse dans ta fiche (onglet Accès), puis recharge la page.`,'<button type="button" class="btn pri" data-act="reload">Recharger</button>')}
  pickView();keepUI();render();setStatus('ok')}
 catch(e){console.error(e);mode=null;const m=String(e&&e.message||e);renderMsg('Impossible de charger les données',/relation|does not exist|schema cache/i.test(m)?'La base de données n’est pas encore configurée : exécute le script <code>supabase/setup.sql</code> dans Supabase (voir SETUP.md).':'Erreur : '+esc(m),'<button type="button" class="btn pri" data-act="reload">Réessayer</button>')}};
const logout=async()=>{team=null;try{await sb.auth.signOut()}catch(e){}session=null;mode=null;myModel=null;S={agency:'Mon Agence',models:[],content:[],tasks:[],prospects:[]};synced=null;renderAuth('login')};

const layer=()=>$('#layer');
const closeLayer=()=>{layer().innerHTML=''};
const openDrawer=(title,id,body,foot,head,tabs)=>{layer().innerHTML=`<div class="ov" data-act="close"></div><form class="drawer" id="${id}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dh${head?' hero':''}">${head||`<h2>${esc(title)}</h2>`}<button type="button" class="icon-btn" data-act="close" aria-label="Fermer">${sv(I.x)}</button>${tabs||''}</div><div class="db">${body}</div><div class="df">${foot}</div></form>`;const f=layer().querySelector('.db input:not([type=hidden]):not([type=radio]),.db textarea');if(f&&!head)f.focus()};

const STC={active:'#34d399',onboarding:'#818cf8',pause:'#9d8fb3'};
const openModel=id=>{const m=id?mdl(id):{id:uid(),name:'',handle:'',niche:'',status:'onboarding',pct:40,price:9.99,subs:0,manager:'',start:T0,ig:'',tt:'',x:'',notes:'',rev:{},color:nextColor()};const ms=months();
 const head=`<span class="av lg" id="fmAv" style="--c:${m.color}">${ini(m.name)}</span><div class="hn"><input class="title-in" name="name" value="${esc(m.name)}" placeholder="Nom de la modèle" required autocomplete="off" aria-label="Nom"><label class="handle-in">@<input name="handle" value="${esc(m.handle)}" placeholder="pseudo_onlyfans" autocomplete="off" aria-label="Pseudo"></label></div>`;

  ${G('Statut',seg('status',ST,m.status,STC),1)}
  ${F('Niche',inp('niche',m.niche,'text','placeholder="fitness, cosplay…"'))}${F('Manager',inp('manager',m.manager,'text','placeholder="Qui s’en occupe ?"'))}
  ${G('Part agence',`<div class="slider"><input type="range" name="pct" min="0" max="80" step="1" value="${+m.pct||0}" aria-label="Part agence en pourcentage"><output id="pctOut">${+m.pct||0} %</output></div><p class="hint" id="pctHint"></p>`,1)}
  ${F('Prix de l’abonnement',euroIn('price',m.price,'min="0" step="0.01"'))}${F('Abonnés',inp('subs',m.subs,'number','min="0" step="1"'))}
  ${F('Début de collaboration',inp('start',m.start,'date'))}
  ${G('Couleur',`<div class="swatches">${COLORS.map(c=>`<label class="sw"><input type="radio" name="color" value="${c}"${c===m.color?' checked':''} aria-label="Couleur ${c}"><span style="--c:${c}"></span></label>`).join('')}</div>`)}
 </div>
 <div class="panel" data-p="r" hidden><p class="hint">Chiffre d’affaires brut de chaque mois, tel qu’affiché sur OnlyFans.</p><div class="revlist">${ms.map(k=>`<div class="revrow"><span class="rm">${cap(mL(k))}</span>${euroIn('rev_'+k,(m.rev||{})[k]??'','min="0" step="1" inputmode="numeric" placeholder="0"')}<div class="rbar"><i></i></div></div>`).join('')}</div><div class="revtot"><span>Total sur 6 mois</span><b id="revTot"></b></div></div>
 <div class="panel" data-p="a" hidden>${F('Email de connexion',inp('email',m.email,'email','placeholder="email de la modèle" autocomplete="off"'),1)}
  <div class="accbox">${m._linked?`<span class="pill p-active">Compte relié</span><p>Elle a accès à son espace avec cet email.</p>`:m.email?`<span class="pill p-pret">En attente</span><p>Envoie-lui le lien du site : elle clique sur « Créer mon compte » avec <b>cet email exact</b>. Son espace s’ouvre automatiquement.</p>`:`<span class="pill">Pas d’accès</span><p>Ajoute son email pour lui ouvrir un espace personnel.</p>`}</div>
  ${G('Lien à lui envoyer',`<div class="copyrow"><input class="field" id="siteUrl" readonly value="${esc(location.origin+location.pathname)}"><button type="button" class="btn" data-act="copyurl">Copier</button></div>`,1)}
  <div class="seeslist"><b>Ce qu’elle voit</b><span>Son planning de contenu, son CA mois par mois et sa part, ses abonnés et les tâches que tu marques « Visible par elle ».</span><b>Ce qu’elle ne voit jamais</b><span>Les autres modèles, tes notes, la prospection, les statistiques de l’agence et les tâches internes.</span></div></div>
 <div class="panel" data-p="n" hidden>${F('Instagram',inp('ig',m.ig,'text','placeholder="pseudo"'))}${F('TikTok',inp('tt',m.tt,'text','placeholder="pseudo"'))}${F('X',inp('x',m.x,'text','placeholder="pseudo"'))}${F('Notes',`<textarea class="field" name="notes" rows="8" placeholder="Préférences, limites, idées de contenu…">${esc(m.notes)}</textarea>`,1)}</div>`;
 openDrawer(m.name||'Nouvelle modèle','fm',body,foot('delmodel',id,id?'Enregistrer':'Créer la fiche'),head,tabsH([['p','Profil'],['r','Revenus'],['a','Accès'],['n','Réseaux et notes']]));liveModel();if(!id)$('#fm [name=name]').focus()};

 const vals=ms.map(k=>+d.get('rev_'+k)||0),mx=Math.max(1,...vals);f.querySelectorAll('.rbar i').forEach((i,j)=>{i.style.width=vals[j]/mx*100+'%';i.style.background=c});$('#revTot').textContent=eur(vals.reduce((a,b)=>a+b,0))};

 ${F('Titre',inp('title',c.title,'text','required autocomplete="off" placeholder="ex. Teaser shooting"'),1)}
 ${G('Modèle',seg('modelId',{'':'Agence',...Object.fromEntries(S.models.map(m=>[m.id,m.name]))},c.modelId,{'':GHOST.color,...Object.fromEntries(S.models.map(m=>[m.id,m.color]))}),1)}

 <label class="agecard"><input type="checkbox" class="chk" name="done"${t.done?' checked':''}><span>Terminée</span></label>`,foot('deltask',id))};
const openProspect=id=>{const p=byId(S.prospects,id);if(!p)return;const m=mdl(p.modelId);
 const head=`<span class="av lg" style="--c:${PSC[p.stage]}">${sv(I.prospection,24)}</span><div class="hn"><label class="title-wrap">@<input class="title-in" name="handle" value="${esc(p.handle)}" required autocomplete="off" aria-label="Pseudo Instagram"></label><a class="instalink" href="https://www.instagram.com/${encodeURIComponent(p.handle)}/" target="_blank" rel="noopener">Voir le profil Instagram ↗</a></div>`;
 openDrawer('@'+p.handle,'fp',`<input type="hidden" name="id" value="${p.id}">
 ${G('Étape',seg('stage',PS,p.stage,PSC),1)}
 ${F('Prénom / nom',inp('name',p.name,'text','placeholder="Facultatif"'))}${F('Niche',inp('niche',p.niche,'text','placeholder="fitness, cosplay…"'))}
 ${F('Abonnés Instagram',inp('followers',p.followers||'','number','min="0" step="1" placeholder="ex. 25000"'))}${F('Relance prévue le',inp('followUp',p.followUp,'date'))}
 ${F('Dernier contact',inp('lastContact',p.lastContact,'date'))}
 <label class="agecard"><input type="checkbox" class="chk" name="ageOk"${p.ageOk?' checked':''}><span>Majeure vérifiée<small>Pièce d’identité vue. Obligatoire pour passer en Signée. Au moindre doute sur l’âge, ne va pas plus loin.</small></span></label>
 ${m?`<p class="hint">Fiche modèle liée : <b>${esc(m.name)}</b></p>`:''}
 ${F('Notes',`<textarea class="field" name="notes" rows="4" placeholder="Message envoyé, sa réponse, ses attentes…">${esc(p.notes)}</textarea>`,1)}`,foot('delp',id),head)};
const openSettings=()=>openDrawer('Réglages','fs',`${F('Nom de l’agence',inp('agency',S.agency,'text','required'),1)}
 <h3>Sauvegarde</h3><p class="hint">Tes données sont enregistrées en ligne. Tu peux aussi copier ce texte pour garder une copie, ou coller une sauvegarde pour la restaurer.</p>
 ${F('Exporter',`<textarea class="field" id="exp" rows="3" readonly>${esc(JSON.stringify(S))}</textarea>`,1)}<div class="full"><button type="button" class="btn" data-act="copy">Copier</button></div>
 ${F('Importer',`<textarea class="field" id="imp" rows="3" placeholder="Collez une sauvegarde ici"></textarea>`,1)}<div class="full"><button type="button" class="btn" data-act="import">Importer</button></div>
 <h3>Données</h3><div class="full"><button type="button" class="btn danger" data-act="reset">${sv(I.trash,18)}Tout effacer et repartir de zéro</button></div>`,`<span class="sp"></span><button type="button" class="btn" data-act="close">Fermer</button><button class="btn pri">Enregistrer</button>`);

/* ---------- événements ---------- */
D.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.type==='checkbox')return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='close')closeLayer();
 else if(a==='auth')renderAuth(b.dataset.v);
 else if(a==='confirm'){const fn=pendingConfirm;pendingConfirm=null;closeLayer();if(fn)fn()}
 else if(a==='reloadteam'){team=null;render()}
 else if(a==='revinv'){const em=b.dataset.v;askConfirm('Annuler l’invitation ?',`<b>${esc(em)}</b> ne deviendra pas admin en créant son compte.`,'Annuler l’invitation',async()=>{const r=await sb.from('admin_invites').delete().eq('email',em);if(r.error)return toast('Erreur : '+r.error.message);toast('Invitation annulée');team=null;render()},1)}
 else if(a==='setrole'){const acc=(team&&team.accounts||[]).find(x=>x.id===id);if(!acc)return;const toAdmin=b.dataset.v==='admin';
  const go=async()=>{const r=await sb.rpc('set_role',{target:id,new_role:b.dataset.v});if(r.error)return toast(r.error.message);toast(toAdmin?`${acc.email} est maintenant admin`:`${acc.email} n’est plus admin`);team=null;render()};
  if(toAdmin)askConfirm('Nommer admin ?',`<b>${esc(acc.email)}</b> aura accès à toute l’agence : toutes les modèles, leurs revenus, tes notes, la prospection et l’équipe.${acc.model_name?` Ce compte est relié à la fiche de <b>${esc(acc.model_name)}</b> : elle verra donc aussi les autres modèles.`:''}`,'Nommer admin',go);
  else askConfirm('Retirer les droits admin ?',`<b>${esc(acc.email)}</b> perdra l’accès au panneau de l’agence à sa prochaine connexion.`,'Retirer les droits',go,1)}
 else if(a==='logout')logout();
 else if(a==='reload')location.reload();
 else if(a==='msp'){ui.msp=+b.dataset.v;keepUI();render()}
 else if(a==='copyurl'){const t=$('#siteUrl');const p=navigator.clipboard&&navigator.clipboard.writeText(t.value);(p||Promise.reject()).then(()=>toast('Lien copié'),()=>{t.focus();t.select();toast('Lien sélectionné : copie-le avec Ctrl+C')})}
 else if(a==='undo'){$('#toast').classList.remove('show');undo()}
 else if(a==='add-model')openModel();
 else if(a==='edit')openModel(id);
 else if(a==='add-content')openContent(null,b.dataset.date);
 else if(a==='editc')openContent(id);
 else if(a==='edittask')openTask(id);
 else if(a==='openp'){if(Date.now()-lastDrag>250)openProspect(id)}
 else if(a==='delp'){const p=byId(S.prospects,id);closeLayer();commit(()=>{S.prospects=S.prospects.filter(x=>x.id!==id)},`@${p?p.handle:''} retirée de la prospection`)}
 else if(a==='settings')openSettings();
 else if(a==='mf'||a==='tf'||a==='ss'||a==='sort'){ui[a==='sort'?'ss':a]=b.dataset.v;keepUI();render()}
 else if(a==='sp'){ui.sp=+b.dataset.v;keepUI();render()}
 else if(a==='togm'){hidden.has(id)?hidden.delete(id):hidden.add(id);if(hidden.size>=S.models.length)hidden.clear();render()}
 else if(a==='togall'){hidden.clear();render()}
 else if(a==='tab'){const f=b.closest('form');f.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));f.querySelectorAll('.panel').forEach(p=>p.hidden=p.dataset.p!==b.dataset.v)}
 else if(a==='delc'){const c=byId(S.content,id);closeLayer();commit(()=>{S.content=S.content.filter(x=>x.id!==id)},`« ${c?c.title:'Contenu'} » supprimé`)}
 else if(a==='deltask'){closeLayer();commit(()=>{S.tasks=S.tasks.filter(x=>x.id!==id)},'Tâche supprimée')}
 else if(a==='delmodel'){const m=mdl(id);closeLayer();commit(()=>{S.models=S.models.filter(x=>x.id!==id);S.content=S.content.filter(x=>x.modelId!==id);S.tasks=S.tasks.filter(x=>x.modelId!==id)},`${m?m.name:'Modèle'} supprimée, avec son planning et ses tâches`)}
 else if(a==='copy'){const t=$('#exp');const p=navigator.clipboard&&navigator.clipboard.writeText(t.value);(p||Promise.reject()).then(()=>toast('Sauvegarde copiée'),()=>{t.focus();t.select();toast('Texte sélectionné : copiez avec Ctrl+C')})}
 else if(a==='import'){try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.models)||!Array.isArray(d.content)||!Array.isArray(d.tasks))throw 0;closeLayer();commit(()=>{S=Object.assign({agency:'Mon Agence',prospects:[]},d)},'Sauvegarde importée')}catch(_){toast('Ce texte n’est pas une sauvegarde valide')}}
 else if(a==='reset'){closeLayer();commit(()=>{S.models=[];S.content=[];S.tasks=[];S.prospects=[];S.sample=false},'Toutes les données ont été effacées')}
});
D.addEventListener('change',e=>{const el=e.target,a=el.dataset.act,id=el.dataset.id;
 if(a==='toggle'){const t=byId(S.tasks,id);if(!t)return;if(mode==='model'){const v=el.checked;t.done=v;render();sb.rpc('set_task_done',{task_id:id,is_done:v}).then(r=>{if(r.error){t.done=!v;render();toast('Impossible d’enregistrer : '+r.error.message)}else toast(v?'Bravo, c’est noté':'Tâche rouverte')})}else commit(()=>{t.done=el.checked},el.checked?'Tâche terminée':null)}
 else if(a==='cstatus'){const c=byId(S.content,id);if(c)commit(()=>{c.status=el.value})}
 else if(a==='pf'){ui.pf=el.value;keepUI();render()}
});
D.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;keepUI();$('#grid').innerHTML=gridHTML()}
 else if(e.target.id==='pq'){ui.pq=e.target.value;keepUI();$('#board').innerHTML=boardHTML()}
 else if(e.target.closest&&e.target.closest('#fm'))liveModel()});

/* glisser-déposer (souris partout sur la carte, tactile via la poignée) */
let drag=null,lastDrag=0;
const endDrag=()=>{if(!drag)return;if(drag.ghost)drag.ghost.remove();drag.card.classList.remove('dragging');D.querySelectorAll('.kcol.over').forEach(c=>c.classList.remove('over'));D.body.classList.remove('dragon');drag=null};
D.addEventListener('pointerdown',e=>{const card=e.target.closest('.pcard');if(!card||e.button>0||drag)return;const onGrip=!!e.target.closest('.grip');if(e.pointerType!=='mouse'&&!onGrip)return;drag={id:card.dataset.id,card,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false,over:null};if(onGrip)e.preventDefault()});
D.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;const r=drag.card.getBoundingClientRect();drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;const g=drag.card.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-act');g.style.width=r.width+'px';D.body.appendChild(g);drag.ghost=g;drag.card.classList.add('dragging');D.body.classList.add('dragon');drag.on=true}
 e.preventDefault();
 drag.ghost.style.transform=`translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px) rotate(2deg)`;
 const el=D.elementFromPoint(e.clientX,e.clientY),col=el&&el.closest('.kcol');
 if(col!==drag.over){if(drag.over)drag.over.classList.remove('over');drag.over=col;if(col)col.classList.add('over')}
 const b=$('#board');if(b){const r=b.getBoundingClientRect();if(e.clientX<r.left+60)b.scrollLeft-=14;else if(e.clientX>r.right-60)b.scrollLeft+=14}
 if(e.clientY<50)scrollBy(0,-12);else if(e.clientY>innerHeight-50)scrollBy(0,12);
},{passive:false});
D.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pid)return;if(!drag.on){drag=null;return}
 lastDrag=Date.now();const st=drag.over&&drag.over.dataset.stage,id=drag.id;endDrag();const p=st&&byId(S.prospects,id);if(p)moveTo(p,st)});
D.addEventListener('pointercancel',endDrag);

/* infobulles */
const hideTip=()=>{const el=$('#tip');if(el)el.classList.remove('on')};
const showTip=e=>{const el=$('#tip');if(!el)return;const t=e.target.closest?e.target.closest('[data-tip]'):null;if(!t||(drag&&drag.on))return hideTip();
 el.textContent=t.dataset.tip;const w=el.offsetWidth,h=el.offsetHeight;let x=e.clientX+14,y=e.clientY-h-12;if(x+w>innerWidth-8)x=e.clientX-w-14;if(x<8)x=8;if(y<8)y=e.clientY+18;el.style.transform=`translate(${x}px,${y}px)`;el.classList.add('on')};
D.addEventListener('pointermove',showTip);D.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')showTip(e)});
D.addEventListener('mouseleave',hideTip);addEventListener('scroll',hideTip,{passive:true});
D.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fid=f.getAttribute('id'),d=Object.fromEntries(new FormData(f)),tr=v=>String(v??'').trim();
 if(fid==='fauth'){doAuth(d);return}
 if(fid==='fadmin'&&mode==='admin'){const em=String(d.email||'').trim().toLowerCase();const known=(team&&team.accounts||[]).find(x=>(x.email||'').toLowerCase()===em);
  const go=async()=>{const r=await sb.rpc('grant_admin',{target_email:em});if(r.error)return toast(r.error.message);toast(r.data==='promoted'?`${em} est maintenant admin`:`Invitation enregistrée : ${em} sera admin dès la création de son compte`);team=null;render()};
  askConfirm('Nommer admin ?',`<b>${esc(em)}</b> aura accès à toute l’agence : toutes les modèles, leurs revenus, tes notes, la prospection et l’équipe.${known&&known.model_name?` Ce compte est relié à la fiche de <b>${esc(known.model_name)}</b>.`:''}${known?'':' Cette personne n’a pas encore de compte : elle deviendra admin en le créant avec cet email.'}`,'Nommer admin',go);return}
 if(mode!=='admin')return;
 if(fid==='fm'){const isNew=!mdl(d.id);commit(()=>{let m=mdl(d.id);if(!m){m={id:d.id,rev:{}};S.models.push(m)}
  Object.assign(m,{name:tr(d.name),handle:tr(d.handle).replace(/^@/,''),niche:tr(d.niche),status:d.status,manager:tr(d.manager),pct:+d.pct||0,price:+d.price||0,subs:+d.subs||0,start:d.start,color:d.color,ig:tr(d.ig),tt:tr(d.tt),x:tr(d.x),notes:d.notes||'',email:tr(d.email).toLowerCase()});
  m.rev=m.rev||{};months().forEach(k=>{const v=d['rev_'+k];if(v===''||v==null)delete m.rev[k];else m.rev[k]=+v})},isNew?`${tr(d.name)} ajoutée`:'Fiche enregistrée');closeLayer()}
 else if(fid==='fc'){const isNew=!byId(S.content,d.id);commit(()=>{let c=byId(S.content,d.id);if(!c){c={id:d.id};S.content.push(c)}Object.assign(c,{title:tr(d.title),modelId:d.modelId,type:d.type,date:d.date,time:d.time,price:d.price===''?'':+d.price,status:d.status,note:d.note||''})},isNew?'Contenu ajouté au planning':'Contenu enregistré');closeLayer()}
 else if(fid==='ft'){const t=byId(S.tasks,d.id);if(t)commit(()=>{Object.assign(t,{title:tr(d.title),modelId:d.modelId,who:tr(d.who),due:d.due,prio:d.prio,done:!!d.done,shared:!!d.shared&&!!d.modelId})},'Tâche enregistrée');closeLayer()}
 else if(fid==='padd'){const hs=[...new Set(String(d.handles).split(/[\s,;]+/).map(cleanHandle).filter(Boolean))],ex=new Set(S.prospects.map(p=>p.handle)),nw=hs.filter(h=>!ex.has(h));
  if(!nw.length){toast(hs.length?'Ces profils sont déjà dans ta liste':'Aucun pseudo valide');return}
  const dup=hs.length-nw.length,s=nw.length>1?'s':'';
  commit(()=>{nw.forEach(h=>S.prospects.push({id:uid(),handle:h,name:'',followers:0,niche:'',stage:'a_contacter',moved:T0,added:T0,lastContact:'',followUp:'',ageOk:false,notes:''}))},`${nw.length} profil${s} ajouté${s}${dup?` (${dup} déjà présent${dup>1?'s':''})`:''}`);
  const q=$('#padd input');if(q)q.focus()}
 else if(fid==='fp'){const p=byId(S.prospects,d.id);if(!p)return;const ageOk=!!d.ageOk;
  if(d.stage==='signee'&&!ageOk){toast('Coche « Majeure vérifiée » avant de la passer en Signée');return}
  let x='';commit(()=>{Object.assign(p,{handle:cleanHandle(d.handle)||p.handle,name:tr(d.name),followers:+d.followers||0,niche:tr(d.niche),lastContact:d.lastContact,followUp:d.followUp,ageOk,notes:d.notes||''});x=applyStage(p,d.stage)},()=>'Fiche enregistrée'+x);closeLayer()}
 else if(fid==='fs'){commit(()=>{S.agency=tr(d.agency)||'Mon Agence'},'Réglages enregistrés');closeLayer()}
 else if(fid==='qadd'){commit(()=>{S.tasks.push({id:uid(),title:tr(d.title),modelId:d.modelId,due:d.due,prio:d.prio,who:'',done:false,shared:!!d.shared&&!!d.modelId})},'Tâche ajoutée');const q=$('#qadd input[name=title]');if(q)q.focus()}
});
D.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer().innerHTML)closeLayer()});
addEventListener('hashchange',()=>{if(!mode)return;const v=location.hash.slice(1);if(VIEWS[v]&&v!==ui.view){ui.view=v;keepUI();closeLayer();render();scrollTo(0,0)}});
D.addEventListener('visibilitychange',async()=>{if(D.visibilityState==='visible'&&mode==='model'){try{await load();if(myModel)render()}catch(e){}}});

(async()=>{
 if(!CFG.url||!CFG.anonKey||/VOTRE|YOUR/.test(CFG.url+CFG.anonKey)||!window.supabase)return renderSetup();
 sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){session=s;renderAuth('reset')}else if(ev==='SIGNED_OUT'&&mode){mode=null;renderAuth('login')}});
 if(/type=recovery/.test(location.hash))return;
 const{data}=await sb.auth.getSession();if(/type=recovery/.test(location.hash)||authMode==='reset')return;await start(data.session);
})();
}</script>
</body>
</html>
